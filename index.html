<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今日の献立 🍱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf6f0;--card:#fff9f2;--border:#e0cdb4;
  --br1:#2c1a0e;--br2:#5c3d2e;--br3:#8b5e3c;--br4:#b07d54;--br5:#d4a97a;--br6:#e8d5b7;
  --cream:#f5ede0;--acc:#b5451b;--accl:#e07a5f;--grn:#4a7a55;
  --txt:#2c1a0e;--txm:#6b4535;--txl:#9e7055;--shd:rgba(44,26,14,0.10);
  --r:14px;--rs:8px;
  --serif:'Noto Serif JP',serif;--sans:'Noto Sans JP',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);font-size:16px;line-height:1.6;background:var(--bg);color:var(--txt);min-height:100svh;overflow-x:hidden}
button{font-family:var(--sans);cursor:pointer}
input,textarea,select{font-family:var(--sans);font-size:16px}
textarea{resize:none}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(44,26,14,.65);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fadeIn .2s ease}
.modal-overlay.hidden{display:none}
.modal-box{background:var(--card);border-radius:var(--r);padding:28px 24px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(44,26,14,.3);animation:slideUp .25s ease}
.modal-box h2{font-family:var(--serif);font-size:19px;color:var(--br2);margin-bottom:10px}
.modal-box p{font-size:13px;color:var(--txl);line-height:1.75;margin-bottom:16px}
.modal-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--txt);font-family:monospace;font-size:15px;letter-spacing:.03em;outline:none;margin-bottom:10px;transition:border-color .2s}
.modal-input:focus{border-color:var(--br4)}

/* Provider selector in modal */
.provider-tabs{display:flex;gap:0;border:1.5px solid var(--border);border-radius:var(--rs);overflow:hidden;margin-bottom:18px}
.provider-tab{flex:1;padding:10px 8px;font-size:14px;font-weight:500;background:#fff;border:none;color:var(--txl);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px}
.provider-tab.active{background:var(--cream);color:var(--br2)}
.provider-tab:first-child{border-right:1.5px solid var(--border)}
.provider-hint{font-size:12px;color:var(--txl);margin-bottom:14px;line-height:1.7;padding:10px 12px;background:var(--cream);border-radius:var(--rs)}
.provider-hint a{color:var(--br3);text-decoration:none}
.modal-section-label{font-size:12px;font-weight:700;color:var(--txl);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.modal-divider{height:1px;background:var(--border);margin:16px 0}

/* HEADER */
.app-header{background:var(--br2);color:#fff9f2;padding:0 18px;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:12px;position:sticky;top:0;z-index:200;box-shadow:0 2px 14px rgba(44,26,14,.18)}
.header-left{display:flex;align-items:baseline;gap:8px}
.header-title{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.04em;line-height:1}
.provider-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;letter-spacing:.04em;line-height:1.4}
.provider-badge.anthropic{background:rgba(255,249,242,.18);color:rgba(255,249,242,.85)}
.provider-badge.gemini{background:rgba(100,180,255,.22);color:rgba(200,235,255,.95)}
.provider-badge.none{background:rgba(255,249,242,.1);color:rgba(255,249,242,.45)}
.icon-btn{background:none;border:none;color:rgba(255,249,242,.75);font-size:20px;padding:4px 7px;border-radius:6px;transition:all .15s;line-height:1}
.icon-btn:hover{color:#fff9f2;background:rgba(255,249,242,.12)}

/* TABS */
.tab-nav{display:flex;background:var(--card);border-bottom:1.5px solid var(--border);position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:190}
.tab-btn{flex:1;background:none;border:none;padding:12px 8px;font-size:14px;font-weight:500;color:var(--txl);position:relative;transition:color .2s;letter-spacing:.02em}
.tab-btn.active{color:var(--br2)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1.5px;left:20%;right:20%;height:2.5px;background:var(--br3);border-radius:2px}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--br5);color:var(--br1);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:10px;padding:0 4px;margin-left:5px;vertical-align:middle}

/* PAGE */
.page{display:none}.page.active{display:block}

/* INPUT PANEL */
.input-panel{background:var(--card);border-bottom:1.5px solid var(--border)}
.input-toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;user-select:none;transition:background .15s}
.input-toggle:active{background:var(--cream)}
.input-toggle-label{font-size:14px;font-weight:500;color:var(--txm);display:flex;align-items:center;gap:7px}
.toggle-icon{color:var(--br4);font-size:13px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.toggle-icon.open{transform:rotate(180deg)}
.input-form{padding:4px 18px 20px;display:none}
.input-form.open{display:block}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--txl);letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px}
.pill-group{display:flex;flex-wrap:wrap;gap:7px}
.pill-item{position:relative}
.pill-item input[type=radio]{position:absolute;opacity:0;width:0}
.pill-item label{display:inline-flex;align-items:center;padding:7px 14px;border-radius:22px;border:1.5px solid var(--border);background:#fff;color:var(--txm);font-size:14px;cursor:pointer;transition:all .18s;user-select:none}
.pill-item input:checked+label{border-color:var(--br3);background:var(--cream);color:var(--br2);font-weight:500}
.auto-fields{display:none;flex-wrap:wrap;gap:8px;margin-top:11px}
.auto-fields.show{display:flex}
.auto-fields input,.auto-fields select{flex:1;min-width:90px;padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--txt);outline:none;transition:border-color .2s}
.auto-fields input:focus,.auto-fields select:focus{border-color:var(--br4)}
.cal-result{width:100%;font-size:13px;color:var(--grn);font-weight:500;padding:2px 0}
.cal-manual-row{display:flex;align-items:center;gap:9px;margin-top:10px}
.cal-manual-row input{flex:1;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--txt);outline:none;font-family:var(--sans);transition:border-color .2s}
.cal-manual-row input:focus{border-color:var(--br4)}
.cal-manual-row span{font-size:13px;color:var(--txl);white-space:nowrap}
.text-input,.textarea-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--txt);outline:none;transition:border-color .2s}
.text-input:focus,.textarea-input:focus{border-color:var(--br4)}
.textarea-input{line-height:1.6}
.suggest-btn{width:100%;padding:15px;background:var(--br2);color:#fff9f2;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;letter-spacing:.04em;transition:all .2s;margin-top:6px}
.suggest-btn:active{transform:scale(.98);background:var(--br3)}
.suggest-btn:disabled{opacity:.5;transform:none;cursor:not-allowed}

/* RESULT */
.result-area{padding:16px}
.empty-state{text-align:center;padding:52px 20px;color:var(--txl)}
.empty-state .eico{font-size:52px;margin-bottom:14px}
.empty-state p{font-size:14px;line-height:1.9}
.loading-wrap{background:var(--card);border-radius:var(--r);border:1.5px solid var(--border);padding:32px 20px;text-align:center}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--br4);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--txl)}
.error-box{background:#fdf0ed;border:1.5px solid var(--accl);border-radius:var(--r);padding:16px;font-size:13px;line-height:1.75;color:var(--acc);margin-bottom:12px}

/* MEAL CARD */
.meal-card{background:var(--card);border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:12px;overflow:hidden;box-shadow:0 2px 10px var(--shd);animation:slideUp .3s ease both}
.meal-card:nth-child(1){animation-delay:.00s}.meal-card:nth-child(2){animation-delay:.06s}
.meal-card:nth-child(3){animation-delay:.12s}.meal-card:nth-child(4){animation-delay:.18s}
.meal-card:nth-child(5){animation-delay:.24s}
.meal-head{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:10px;transition:background .15s}
.meal-head:active{background:var(--cream)}
.meal-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--br2);flex:1;line-height:1.4}
.meal-badges{display:flex;gap:5px;align-items:center;flex-shrink:0}
.badge{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--cream);color:var(--txl);white-space:nowrap}
.badge.cat{background:var(--br6);color:var(--br2)}
.chevron{color:var(--br4);font-size:13px;transition:transform .3s cubic-bezier(.4,0,.2,1);flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.meal-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.meal-body.open{max-height:1400px}
.meal-inner{padding:0 16px 16px;border-top:1px solid var(--border)}
.meal-cook{font-size:12px;color:var(--txl);margin-top:10px}
.meal-desc{font-size:14px;color:var(--txm);line-height:1.85;margin:12px 0 14px}
.sec-title{font-size:11px;font-weight:700;color:var(--txl);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:12px;padding:4px 10px;background:var(--cream);border-radius:16px;color:var(--txm)}
.steps-list{margin-bottom:14px}
.step-row{display:flex;gap:11px;margin-bottom:9px;font-size:13px;line-height:1.75;color:var(--txm)}
.step-num{flex-shrink:0;width:21px;height:21px;background:var(--br4);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.save-btn{width:100%;padding:11px;border-radius:var(--rs);border:1.5px solid var(--br5);background:transparent;color:var(--br3);font-size:14px;font-weight:500;transition:all .2s}
.save-btn:hover{background:var(--cream)}
.save-btn.saved{background:#f0faf2;border-color:var(--grn);color:var(--grn);cursor:default}

/* LOG PAGE */
.log-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:13px 16px;background:var(--card);border-bottom:1.5px solid var(--border)}
.log-count{font-size:13px;color:var(--txl);flex-shrink:0}
.toolbar-btns{display:flex;gap:7px;flex-wrap:wrap}
.toolbar-btn{padding:7px 13px;font-size:13px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--txm);transition:all .18s;white-space:nowrap}
.toolbar-btn:hover{background:var(--cream)}
.toolbar-btn.danger{color:var(--acc);border-color:var(--accl)}
.toolbar-btn.danger:hover{background:#fdf0ed}
.log-list{padding:14px 16px}
.log-empty{text-align:center;padding:52px 20px;color:var(--txl)}
.log-empty .eico{font-size:42px;margin-bottom:12px}
.log-empty p{font-size:14px;line-height:1.9}
.log-item{background:var(--card);border-radius:var(--r);border:1.5px solid var(--border);padding:13px 15px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 1px 5px var(--shd);animation:slideUp .25s ease both}
.log-info{flex:1;min-width:0}
.log-name{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--br2);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--txl)}
.log-del{flex-shrink:0;background:none;border:none;font-size:19px;color:var(--br5);padding:3px 5px;border-radius:5px;transition:color .2s;line-height:1}
.log-del:hover{color:var(--acc)}

/* TOAST */
.toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(90px);background:var(--br1);color:#fff9f2;padding:11px 22px;border-radius:28px;font-size:14px;font-weight:500;z-index:9000;white-space:nowrap;max-width:88vw;text-align:center;box-shadow:0 4px 20px rgba(44,26,14,.25);transition:transform .32s cubic-bezier(.4,0,.2,1);pointer-events:none;overflow:hidden;text-overflow:ellipsis}
.toast.visible{transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--acc)}
.toast.success{background:var(--grn)}

.btn-primary{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;background:var(--br2);color:#fff9f2;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;transition:background .2s;width:100%}
.btn-primary:hover{background:var(--br3)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bottom-space{height:calc(24px + env(safe-area-inset-bottom))}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--br6);border-radius:4px}
</style>
</head>
<body>

<!-- ===== 設定モーダル ===== -->
<div class="modal-overlay hidden" id="apiModal">
  <div class="modal-box">
    <h2>⚙️ API設定</h2>

    <!-- プロバイダー切替タブ -->
    <div class="modal-section-label">使用するAI</div>
    <div class="provider-tabs">
      <button class="provider-tab active" id="ptab-anthropic" onclick="selectProvider('anthropic')">
        🟤 Claude (Anthropic)
      </button>
      <button class="provider-tab" id="ptab-gemini" onclick="selectProvider('gemini')">
        🔵 Gemini (Google)
      </button>
    </div>

    <!-- Anthropic パネル -->
    <div id="panel-anthropic">
      <div class="provider-hint">
        <b>APIキーの取得：</b><a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys → Create Key<br>
        新規登録時に約$5の無料クレジットがもらえる場合があります。
      </div>
      <div class="modal-section-label">Anthropic APIキー</div>
      <input type="password" class="modal-input" id="keyInputAnthropic" placeholder="sk-ant-api..." autocomplete="off" spellcheck="false">
    </div>

    <!-- Gemini パネル -->
    <div id="panel-gemini" style="display:none">
      <div class="provider-hint">
        <b>APIキーの取得：</b><a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> → Create API key<br>
        無料枠が大きく、個人利用ならほぼ無料で使えます。
      </div>
      <div class="modal-section-label">Gemini APIキー</div>
      <input type="password" class="modal-input" id="keyInputGemini" placeholder="AIza..." autocomplete="off" spellcheck="false">
    </div>

    <button class="btn-primary" onclick="saveSettings()">保存して始める</button>
  </div>
</div>

<!-- ===== HEADER ===== -->
<header class="app-header">
  <div class="header-left">
    <div class="header-title">🍱 今日の献立</div>
    <span class="provider-badge none" id="providerBadge">未設定</span>
  </div>
  <button class="icon-btn" onclick="openSettings()" title="API設定">⚙️</button>
</header>

<!-- ===== TABS ===== -->
<nav class="tab-nav">
  <button class="tab-btn active" id="tab-suggest" onclick="switchTab('suggest')">🍽 提案</button>
  <button class="tab-btn" id="tab-log" onclick="switchTab('log')">📋 ログ <span class="tab-badge" id="logBadge">0</span></button>
</nav>

<!-- ===== 提案画面 ===== -->
<div class="page active" id="page-suggest">
  <div class="input-panel">
    <div class="input-toggle" onclick="toggleForm()">
      <div class="input-toggle-label"><span>📝</span><span>入力条件を設定する</span></div>
      <span class="toggle-icon" id="toggleIcon">▼</span>
    </div>
    <div class="input-form" id="inputForm">

      <div class="form-group">
        <label class="form-label">目標カロリー</label>
        <div class="pill-group">
          <div class="pill-item">
            <input type="radio" name="calMode" id="calManual" value="manual" checked onchange="onCalModeChange()">
            <label for="calManual">✏️ 手動入力</label>
          </div>
          <div class="pill-item">
            <input type="radio" name="calMode" id="calAuto" value="auto" onchange="onCalModeChange()">
            <label for="calAuto">🧮 自動計算</label>
          </div>
        </div>
        <div id="calManualArea">
          <div class="cal-manual-row">
            <input type="number" id="manualCal" placeholder="例：1800" min="500" max="6000">
            <span>kcal / 1日</span>
          </div>
        </div>
        <div class="auto-fields" id="calAutoArea">
          <input type="number" id="weight" placeholder="体重 (kg)" min="30" max="250">
          <input type="number" id="height" placeholder="身長 (cm)" min="100" max="250">
          <select id="activity">
            <option value="1.2">ほぼ座り仕事</option>
            <option value="1.375">軽い運動あり</option>
            <option value="1.55" selected>適度な運動</option>
            <option value="1.725">活発に運動</option>
            <option value="1.9">激しい運動</option>
          </select>
          <div class="cal-result" id="calResult"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="exclude">除外したい食材・アレルギー</label>
        <input type="text" id="exclude" class="text-input" placeholder="例：えび・そば・乳製品・辛いもの">
      </div>

      <div class="form-group">
        <label class="form-label" for="mood">気分・食べたいもの</label>
        <input type="text" id="mood" class="text-input" placeholder="例：さっぱりしたもの、和食、丼もの">
      </div>

      <div class="form-group">
        <label class="form-label">調理時間</label>
        <div class="pill-group">
          <div class="pill-item"><input type="radio" name="cookTime" id="t15" value="15分以内" checked><label for="t15">⏱ 15分以内</label></div>
          <div class="pill-item"><input type="radio" name="cookTime" id="t30" value="30分程度"><label for="t30">30分</label></div>
          <div class="pill-item"><input type="radio" name="cookTime" id="t60" value="1時間程度"><label for="t60">1時間</label></div>
          <div class="pill-item"><input type="radio" name="cookTime" id="tAny" value="問わない"><label for="tAny">問わない</label></div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:10px">
        <label class="form-label" for="notes">備考・その他</label>
        <textarea id="notes" class="textarea-input" rows="2" placeholder="例：冷蔵庫に豚肉がある、子供も食べる、ダイエット中"></textarea>
      </div>

      <button class="suggest-btn" id="suggestBtn" onclick="getSuggestion()">✨ 献立を提案してもらう</button>
    </div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="empty-state">
      <div class="eico">🍱</div>
      <p>条件を設定して<br>「提案してもらう」を押してください</p>
    </div>
  </div>
  <div class="bottom-space"></div>
</div>

<!-- ===== ログ画面 ===== -->
<div class="page" id="page-log">
  <div class="log-toolbar">
    <span class="log-count" id="logCountLabel">0 件保存済み</span>
    <div class="toolbar-btns">
      <button class="toolbar-btn" onclick="triggerImport()">📥 インポート</button>
      <button class="toolbar-btn" onclick="exportLogs()">📤 エクスポート</button>
      <button class="toolbar-btn danger" onclick="clearAllLogs()">🗑 全削除</button>
    </div>
  </div>
  <div class="log-list" id="logList"></div>
  <div class="bottom-space"></div>
</div>

<input type="file" id="importInput" accept=".html" style="display:none" onchange="handleImport(this)">
<div class="toast" id="toast"></div>

<script>
/* ===== STATE ===== */
var provider = 'anthropic'; // 'anthropic' | 'gemini'
var keys = { anthropic: '', gemini: '' };
var logs = [], currentMeals = [], formOpen = false;

/* ===== INIT ===== */
function init() {
  provider = localStorage.getItem('menuProvider') || 'anthropic';
  keys.anthropic = localStorage.getItem('menuKeyAnthropic') || '';
  keys.gemini    = localStorage.getItem('menuKeyGemini')    || '';
  logs = JSON.parse(localStorage.getItem('menuAppLogs') || '[]');

  updateProviderBadge();
  updateBadge();
  renderLogs();
  toggleForm(true);

  if (!keys[provider]) showApiModal();

  ['weight','height','activity'].forEach(function(id){
    document.getElementById(id).addEventListener('input', calcTDEE);
  });
}

/* ===== MODAL ===== */
function showApiModal() {
  document.getElementById('apiModal').classList.remove('hidden');
  // プロバイダータブを現在の状態に合わせる
  selectProvider(provider, true);
}
function openSettings() { showApiModal(); }

function selectProvider(p, silent) {
  provider = p;
  // タブの見た目を切替
  document.getElementById('ptab-anthropic').classList.toggle('active', p === 'anthropic');
  document.getElementById('ptab-gemini').classList.toggle('active', p === 'gemini');
  document.getElementById('panel-anthropic').style.display = p === 'anthropic' ? '' : 'none';
  document.getElementById('panel-gemini').style.display    = p === 'gemini'    ? '' : 'none';
  // 既存キーを入力欄に反映
  document.getElementById('keyInputAnthropic').value = keys.anthropic;
  document.getElementById('keyInputGemini').value    = keys.gemini;
  if (!silent) localStorage.setItem('menuProvider', p);
}

function saveSettings() {
  var inputEl = provider === 'anthropic'
    ? document.getElementById('keyInputAnthropic')
    : document.getElementById('keyInputGemini');
  var v = inputEl.value.trim();

  if (!v) { showToast('APIキーを入力してください', 'error'); return; }

  if (provider === 'anthropic' && !v.startsWith('sk-')) {
    showToast('AnthropicキーはSK-から始まります', 'error'); return;
  }
  if (provider === 'gemini' && !v.startsWith('AIza')) {
    showToast('GeminiキーはAIzaから始まります', 'error'); return;
  }

  keys[provider] = v;
  localStorage.setItem('menuProvider', provider);
  localStorage.setItem('menuKeyAnthropic', keys.anthropic);
  localStorage.setItem('menuKeyGemini',    keys.gemini);

  document.getElementById('apiModal').classList.add('hidden');
  updateProviderBadge();
  showToast('設定を保存しました', 'success');
}

document.getElementById('apiModal').addEventListener('click', function(e){
  if (e.target === this && keys[provider]) this.classList.add('hidden');
});

/* ===== PROVIDER BADGE ===== */
function updateProviderBadge() {
  var badge = document.getElementById('providerBadge');
  if (provider === 'anthropic' && keys.anthropic) {
    badge.textContent = 'Claude'; badge.className = 'provider-badge anthropic';
  } else if (provider === 'gemini' && keys.gemini) {
    badge.textContent = 'Gemini'; badge.className = 'provider-badge gemini';
  } else {
    badge.textContent = '未設定'; badge.className = 'provider-badge none';
  }
}

/* ===== TABS ===== */
function switchTab(tab) {
  ['suggest','log'].forEach(function(t){
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('page-'+t).classList.toggle('active', t===tab);
  });
  if (tab === 'log') renderLogs();
}

/* ===== FORM TOGGLE ===== */
function toggleForm(force) {
  formOpen = (force !== undefined) ? force : !formOpen;
  document.getElementById('inputForm').classList.toggle('open', formOpen);
  document.getElementById('toggleIcon').classList.toggle('open', formOpen);
}

/* ===== CALORIE ===== */
function onCalModeChange() {
  var isAuto = document.querySelector('input[name="calMode"]:checked').value === 'auto';
  document.getElementById('calManualArea').style.display = isAuto ? 'none' : 'block';
  document.getElementById('calAutoArea').classList.toggle('show', isAuto);
  if (isAuto) calcTDEE();
}
function calcTDEE() {
  var w=parseFloat(document.getElementById('weight').value);
  var h=parseFloat(document.getElementById('height').value);
  var a=parseFloat(document.getElementById('activity').value);
  var el=document.getElementById('calResult');
  if(w&&h){
    var bmr=10*w+6.25*h-5*35+5;
    var tdee=Math.round(bmr*a);
    el.textContent='推定消費カロリー：約 '+tdee.toLocaleString()+' kcal / 日';
    el.dataset.tdee=tdee;
  }else{el.textContent='';delete el.dataset.tdee;}
}
function getCalorieInfo() {
  var mode=document.querySelector('input[name="calMode"]:checked').value;
  if(mode==='manual'){
    var v=document.getElementById('manualCal').value;
    return v?v+' kcal / 1日':'指定なし';
  }else{
    var v=document.getElementById('calResult').dataset.tdee;
    return v?'約 '+v+' kcal / 1日（自動計算）':'指定なし';
  }
}

/* ===== BUILD PROMPT ===== */
function buildPrompt() {
  var calorie  = getCalorieInfo();
  var exclude  = document.getElementById('exclude').value.trim();
  var mood     = document.getElementById('mood').value.trim();
  var cookTime = document.querySelector('input[name="cookTime"]:checked').value;
  var notes    = document.getElementById('notes').value.trim();
  return 'あなたはプロの栄養士です。以下の条件で本日の献立を3〜5品提案してください。\n\n【条件】\n- 目標カロリー: '+calorie+'\n'
    +(exclude?'- 除外・アレルギー: '+exclude+'\n':'')
    +(mood?'- 気分・希望: '+mood+'\n':'')
    +'- 調理時間: '+cookTime+'\n'
    +(notes?'- 備考: '+notes+'\n':'')
    +'\n必ず以下のJSON形式のみで出力してください（説明文・Markdownコードブロック不要）：\n{"meals":[{"name":"料理名","category":"朝食/昼食/夕食/おやつ","calories":数値,"cookTime":"XX分","description":"2〜3文の説明","ingredients":["材料1","材料2"],"steps":["手順1","手順2"]}]}';
}

/* ===== API CALL: ANTHROPIC ===== */
async function callAnthropic(prompt) {
  var res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': keys.anthropic,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 2400,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok) {
    var err = await res.json().catch(function(){return{};});
    var msg = (err&&err.error&&err.error.message)||'';
    if (res.status===401) throw new Error('APIキーが無効です。⚙️ から再設定してください。');
    if (res.status===429||msg.includes('credit')||msg.includes('quota'))
      throw new Error('クレジット残量不足またはレート制限です。');
    throw new Error('Anthropic APIエラー ('+res.status+')'+(msg?': '+msg:''));
  }
  var data = await res.json();
  return data.content.filter(function(c){return c.type==='text';}).map(function(c){return c.text;}).join('');
}

/* ===== API CALL: GEMINI ===== */
async function callGemini(prompt) {
  var model = 'gemini-2.0-flash';
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+keys.gemini;
  var res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: 2400, temperature: 0.7 }
    })
  });
  if (!res.ok) {
    var err = await res.json().catch(function(){return{};});
    var msg = (err&&err.error&&err.error.message)||'';
    if (res.status===400) throw new Error('GeminiキーまたはリクエストエラーError ('+res.status+'): '+msg);
    if (res.status===403) throw new Error('Gemini APIキーが無効です。⚙️ から再設定してください。');
    if (res.status===429) throw new Error('Geminiのレート制限に達しました。しばらくしてから再試行してください。');
    throw new Error('Gemini APIエラー ('+res.status+')'+(msg?': '+msg:''));
  }
  var data = await res.json();
  var cands = data.candidates;
  if (!cands||!cands[0]) throw new Error('Geminiから応答が得られませんでした。');
  return cands[0].content.parts.map(function(p){return p.text||'';}).join('');
}

/* ===== GET SUGGESTION ===== */
async function getSuggestion() {
  var currentKey = keys[provider];
  if (!currentKey) { showApiModal(); return; }

  var btn = document.getElementById('suggestBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 考え中...';

  var prompt = buildPrompt();
  document.getElementById('resultArea').innerHTML =
    '<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">献立を考えています…</div></div>';

  try {
    var rawText = provider === 'gemini'
      ? await callGemini(prompt)
      : await callAnthropic(prompt);

    var clean = rawText.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    var parsed = JSON.parse(clean);
    currentMeals = parsed.meals || [];
    if (currentMeals.length === 0) throw new Error('提案が取得できませんでした。もう一度お試しください。');
    renderMeals();
    toggleForm(false);
  } catch(e) {
    document.getElementById('resultArea').innerHTML = '<div class="error-box">⚠️ '+esc(e.message)+'</div>';
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ 献立を提案してもらう';
  }
}

/* ===== RENDER MEALS ===== */
function renderMeals() {
  var area = document.getElementById('resultArea');
  area.innerHTML = '';
  currentMeals.forEach(function(m, i) {
    var isSaved = logs.some(function(l){return l.mealRef===makeMealRef(m);});
    var card = document.createElement('div');
    card.className = 'meal-card';
    card.innerHTML =
      '<div class="meal-head" onclick="toggleCard('+i+')">'
        +'<div class="meal-title">'+esc(m.name)+'</div>'
        +'<div class="meal-badges">'
          +(m.category?'<span class="badge cat">'+esc(m.category)+'</span>':'')
          +(m.calories?'<span class="badge">'+m.calories+'kcal</span>':'')
        +'</div>'
        +'<span class="chevron" id="chev-'+i+'">▼</span>'
      +'</div>'
      +'<div class="meal-body" id="mbody-'+i+'">'
        +'<div class="meal-inner">'
          +(m.cookTime?'<div class="meal-cook">⏱ '+esc(m.cookTime)+'</div>':'')
          +'<p class="meal-desc">'+esc(m.description||'')+'</p>'
          +(m.ingredients&&m.ingredients.length
            ?'<div class="sec-title">材料</div><div class="chips">'+m.ingredients.map(function(x){return'<span class="chip">'+esc(x)+'</span>';}).join('')+'</div>':'')
          +(m.steps&&m.steps.length
            ?'<div class="sec-title">作り方</div><div class="steps-list">'+m.steps.map(function(s,si){
              return'<div class="step-row"><div class="step-num">'+(si+1)+'</div><div>'+esc(s)+'</div></div>';
            }).join('')+'</div>':'')
          +'<button class="save-btn'+(isSaved?' saved':'')+(isSaved?'" onclick=""':'" onclick="saveMeal('+i+')"')+'>'+(isSaved?'✓ 保存済み':'📌 ログに保存')+'</button>'
        +'</div>'
      +'</div>';
    area.appendChild(card);
  });
}
function toggleCard(i) {
  var body=document.getElementById('mbody-'+i);
  var chev=document.getElementById('chev-'+i);
  chev.classList.toggle('open', body.classList.toggle('open'));
}
function makeMealRef(m){return m.name+'|'+m.category+'|'+m.calories;}

/* ===== SAVE MEAL ===== */
function saveMeal(i) {
  var m=currentMeals[i]; if(!m)return;
  var entry={
    id:Date.now()+'_'+Math.random().toString(36).slice(2,6),
    mealRef:makeMealRef(m),name:m.name,category:m.category||'',
    calories:m.calories||'',cookTime:m.cookTime||'',description:m.description||'',
    ingredients:m.ingredients||[],steps:m.steps||[],
    savedAt:new Date().toISOString()
  };
  logs.unshift(entry); persistLogs(); updateBadge();
  var btn=document.getElementById('mbody-'+i).querySelector('.save-btn');
  if(btn){btn.textContent='✓ 保存済み';btn.classList.add('saved');btn.onclick=null;}
  showToast('「'+m.name+'」を保存しました','success');
}

/* ===== LOG ===== */
function persistLogs(){localStorage.setItem('menuAppLogs',JSON.stringify(logs));}
function updateBadge(){
  document.getElementById('logBadge').textContent=logs.length;
  document.getElementById('logCountLabel').textContent=logs.length+' 件保存済み';
}
function renderLogs(){
  updateBadge();
  var list=document.getElementById('logList');
  if(logs.length===0){
    list.innerHTML='<div class="log-empty"><div class="eico">📋</div><p>まだ保存した献立はありません。<br>提案画面から「ログに保存」してください。</p></div>';
    return;
  }
  list.innerHTML='';
  logs.forEach(function(entry,i){
    var d=new Date(entry.savedAt);
    var ds=d.getFullYear()+'/'+(String(d.getMonth()+1).padStart(2,'0'))+'/'+String(d.getDate()).padStart(2,'0');
    var item=document.createElement('div');
    item.className='log-item';
    item.innerHTML=
      '<div class="log-info">'
        +'<div class="log-name">'+esc(entry.name)+'</div>'
        +'<div class="log-meta">'
          +(entry.category?'<span>'+esc(entry.category)+'</span>':'')
          +(entry.calories?'<span>🔥 '+entry.calories+'kcal</span>':'')
          +(entry.cookTime?'<span>⏱ '+esc(entry.cookTime)+'</span>':'')
          +'<span>📅 '+ds+'</span>'
        +'</div>'
      +'</div>'
      +'<button class="log-del" onclick="deleteLog('+i+')" title="削除">✕</button>';
    list.appendChild(item);
  });
}
function deleteLog(i){
  var name=logs[i]?logs[i].name:'';
  logs.splice(i,1);persistLogs();renderLogs();
  showToast('「'+name+'」を削除しました');
}
function clearAllLogs(){
  if(logs.length===0){showToast('ログは空です');return;}
  if(!confirm('全 '+logs.length+' 件のログを削除してよいですか？'))return;
  logs=[];persistLogs();renderLogs();showToast('全ログを削除しました');
}

/* ===== EXPORT ===== */
function exportLogs(){
  if(logs.length===0){showToast('エクスポートするログがありません');return;}
  var items=logs.map(function(e){
    var d=new Date(e.savedAt);
    var ds=d.getFullYear()+'/'+(String(d.getMonth()+1).padStart(2,'0'))+'/'+String(d.getDate()).padStart(2,'0');
    return '<div class="entry">'
      +'<div class="entry-head"><span class="ename">'+esc(e.name)+'</span>'
      +'<span class="emeta">'+[e.category,e.calories?e.calories+'kcal':'',e.cookTime].filter(Boolean).join(' ｜ ')+'</span>'
      +'<span class="edate">'+ds+'</span></div>'
      +(e.description?'<p class="edesc">'+esc(e.description)+'</p>':'')
      +(e.ingredients&&e.ingredients.length?'<div class="eingr">🥕 '+e.ingredients.map(function(x){return esc(x);}).join('、')+'</div>':'')
      +'</div>';
  }).join('\n');
  var html='<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1.0">\n<title>献立ログ</title>\n<style>\nbody{font-family:"Noto Sans JP",sans-serif;background:#faf6f0;color:#2c1a0e;max-width:680px;margin:0 auto;padding:20px 16px}\nh1{font-family:"Noto Serif JP",serif;font-size:22px;color:#5c3d2e;margin-bottom:4px}\n.subtitle{font-size:13px;color:#9e7055;margin-bottom:24px}\n.entry{background:#fff9f2;border:1.5px solid #e0cdb4;border-radius:12px;padding:15px 17px;margin-bottom:11px}\n.entry-head{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;margin-bottom:7px}\n.ename{font-size:17px;font-weight:700;color:#5c3d2e;font-family:"Noto Serif JP",serif}\n.emeta{font-size:12px;color:#9e7055}\n.edate{font-size:12px;color:#b07d54;margin-left:auto}\n.edesc{font-size:13px;color:#6b4535;line-height:1.75;margin:0 0 7px}\n.eingr{font-size:12px;color:#9e7055}\n</style>\n</head>\n<body>\n<h1>🍱 献立ログ</h1>\n<p class="subtitle">エクスポート日：'+new Date().toLocaleDateString('ja-JP')+' ｜ '+logs.length+'件</p>\n<!--MENUAPP_LOG_JSON\n'+JSON.stringify(logs,null,2)+'\nEND_MENUAPP_LOG_JSON-->\n'+items+'\n</body>\n</html>';
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='献立ログ_'+new Date().toISOString().slice(0,10)+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(logs.length+'件をエクスポートしました','success');
}

/* ===== IMPORT ===== */
function triggerImport(){document.getElementById('importInput').click();}
function handleImport(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var text=e.target.result;
      var match=text.match(/<!--MENUAPP_LOG_JSON\n([\s\S]*?)\nEND_MENUAPP_LOG_JSON-->/);
      if(!match)throw new Error('有効な献立ログHTMLファイルではありません');
      var imported=JSON.parse(match[1].trim());
      if(!Array.isArray(imported))throw new Error('データ形式が不正です');
      var existIds=new Set(logs.map(function(l){return l.id;}));
      var added=0;
      imported.forEach(function(entry){if(!existIds.has(entry.id)){logs.push(entry);added++;}});
      logs.sort(function(a,b){return new Date(b.savedAt)-new Date(a.savedAt);});
      persistLogs();renderLogs();
      showToast(added+'件をインポートしました（重複除外済み）','success');
    }catch(err){showToast('インポート失敗: '+err.message,'error');}
    input.value='';
  };
  reader.readAsText(file,'utf-8');
}

/* ===== TOAST ===== */
var toastTimer;
function showToast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='toast'+(type?' '+type:'');
  el.classList.add('visible');clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('visible');},3200);
}

/* ===== UTIL ===== */
function esc(str){
  if(!str)return'';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
