<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>レシピ</title>
<link rel="icon" href="icon-rla.png" type="image/png">
<link rel="apple-touch-icon" href="icon-rla.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F6F1E6;
  --panel: #FFFDF7;
  --panel-2: #FBF6EC;
  --ink: #2E2A24;
  --sub: #7A7168;
  --line: #E4DBC8;
  --primary: #2C4462;      /* 藍色 */
  --primary-dark: #1D2F44;
  --primary-soft: #DCE4EC;
  --gold: #D9A441;         /* 山吹色 (お気に入り) */
  --tag-bg: #E6EEDA;       /* 若草色系 */
  --tag-fg: #4C6B3E;
  --danger: #8B3A3A;       /* 蘇芳 */
  --danger-soft: #F3E4E1;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(46,42,36,0.06);
}
*{box-sizing:border-box; min-width:0;}
html,body{margin:0;padding:0; max-width:100%; overflow-x:hidden;}
input,textarea,select{max-width:100%;}
body{
  background: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(46,42,36,0.035) 1px, transparent 0);
  background-size: 16px 16px;
  color: var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom: 60px;
}
h1,h2,h3,.brand{font-family:"Shippori Mincho",serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8CBB0;border-radius:8px;}

header{
  position:sticky; top:0; z-index:20;
  background: var(--panel);
  border-bottom:1px solid var(--line);
  padding: 12px 16px;
}
.header-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.brand{font-size:1.35rem; font-weight:700; color:var(--primary-dark); letter-spacing:.02em;}
.brand small{display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-size:.65rem; color:var(--sub); font-weight:400; margin-top:1px;}
nav{display:flex; gap:6px;}
.tab-btn{
  border:1px solid var(--line); background:var(--panel-2); color:var(--sub);
  padding:8px 14px; border-radius:999px; font-size:.85rem; font-weight:500;
}
.tab-btn.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.updated-line{font-size:.72rem; color:var(--sub); margin-top:6px;}

main{max-width:920px; margin:0 auto; padding:18px 14px;}
section[hidden]{display:none;}

.toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-box{
  flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--line);
  border-radius:10px; background:var(--panel); font-size:.9rem;
}
.btn{
  border:none; border-radius:10px; padding:9px 16px; font-size:.88rem; font-weight:500;
  background:var(--primary); color:#fff; box-shadow:var(--shadow);
}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--panel-2); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:var(--danger-soft); color:var(--danger); border:1px solid #E4C9C4;}
.btn.small{padding:5px 10px; font-size:.78rem; border-radius:8px;}
.btn.ghost{background:transparent; color:var(--primary); box-shadow:none; padding:4px 8px;}

.recipe-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.recipe-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; box-shadow:var(--shadow); position:relative; cursor:pointer;
}
.recipe-card .fav-star{
  position:absolute; top:10px; right:10px; font-size:1.1rem; background:none; border:none;
  color:#D8CBB0; padding:2px; line-height:1;
}
.recipe-card .fav-star.on{color:var(--gold);}
.recipe-card h3{margin:0 26px 6px 0; font-size:1.02rem; color:var(--ink);}
.recipe-card .meta{font-size:.7rem; color:var(--sub); margin-bottom:8px;}
.chip-row{display:flex; flex-wrap:wrap; gap:5px;}
.scroll-limited{
  max-height:120px; overflow-y:auto; border:1px dashed var(--line); border-radius:10px;
  padding:8px; background:var(--panel-2);
}

.tag-chip{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--tag-bg); color:var(--tag-fg); font-size:.72rem; font-weight:500;
  padding:3px 9px 3px 7px; border-radius:999px; white-space:nowrap;
}
.tag-chip::before{
  content:""; width:5px; height:5px; border-radius:50%; background:#fff;
  border:1px solid rgba(76,107,62,.35); display:inline-block;
}
.tag-chip .x{cursor:pointer; opacity:.6; font-weight:700; margin-left:2px;}
.tag-chip .x:hover{opacity:1;}

.empty-state{
  text-align:center; color:var(--sub); padding:50px 20px; font-size:.9rem;
  border:1px dashed var(--line); border-radius:var(--radius); background:var(--panel-2);
}

/* Modal */
.overlay{
  position:fixed; inset:0; background:rgba(30,26,20,.42); z-index:50;
  display:flex; align-items:flex-start; justify-content:center; padding:24px 10px;
  overflow-y:auto;
}
.overlay[hidden]{display:none;}
#detailOverlay{ z-index:60; }
.modal-box{
  background:var(--panel); border-radius:18px; width:100%; max-width:680px;
  padding:0; box-shadow:0 12px 40px rgba(0,0,0,.18); margin-bottom:24px;
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; background:var(--panel); border-radius:18px 18px 0 0;
}
.modal-head h2{margin:0; font-size:1.1rem;}
.modal-close{background:none; border:none; font-size:1.3rem; color:var(--sub); line-height:1; padding:4px 6px;}
.modal-body{padding:16px 18px 6px;}
.modal-foot{
  display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--line);
}

.field{margin-bottom:16px;}
.field label{display:block; font-size:.78rem; color:var(--sub); margin-bottom:6px; font-weight:500;}
.field input[type=text], .field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
  background:var(--panel-2); font-size:.92rem; resize:vertical;
}
.fav-toggle{display:flex; align-items:center; gap:8px;}
.fav-toggle button{
  border:1px solid var(--line); background:var(--panel-2); border-radius:999px;
  padding:6px 14px; font-size:.85rem; color:var(--sub);
}
.fav-toggle button.on{background:#FBF0D9; border-color:#E9CC8E; color:#8A6A1E; font-weight:600;}

/* tag input */
.tag-input-wrap{
  border:1px solid var(--line); border-radius:10px; background:var(--panel-2);
  padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; position:relative;
}
.tag-input-wrap input{
  border:none; background:transparent; outline:none; flex:1; min-width:100px; font-size:.88rem; padding:4px;
}
.tag-chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.tag-candidate-area{margin-top:8px;}
.tag-candidate-label{font-size:.72rem; color:var(--sub); margin-bottom:5px;}
.tag-candidate-chip{
  background:#fff; border:1px dashed var(--primary); color:var(--primary-dark);
  border-radius:999px; padding:3px 10px; font-size:.75rem; margin:0 6px 6px 0;
}
.tag-suggest{
  position:absolute; left:0; top:100%; margin-top:4px; background:#fff; border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); z-index:5; width:100%; max-height:160px; overflow-y:auto;
}
.tag-suggest div{padding:8px 12px; font-size:.85rem; cursor:pointer;}
.tag-suggest div:hover{background:var(--panel-2);}

/* ingredients */
.ing-columns{display:flex; gap:14px; align-items:flex-start;}
.ing-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:12px;}
.ing-group{
  border:1px solid var(--line); border-radius:12px; background:var(--panel-2); padding:10px 12px;
}
.ing-group-head{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
.ing-group-head input{
  border:none; background:transparent; font-weight:600; font-size:.85rem; color:var(--primary-dark);
  padding:2px 4px; border-bottom:1px dashed transparent;
}
.ing-group-head input:focus{outline:none; border-bottom:1px dashed var(--line);}
.ing-row{display:flex; gap:6px; margin-bottom:6px; align-items:center;}
.ing-row input{
  border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:.85rem; background:#fff;
}
.ing-row .name{flex:1.4;}
.ing-row .amount{flex:1;}
.ing-row .del{background:none; border:none; color:var(--danger); font-size:1rem; padding:2px 4px;}
.helper-dock{
  position:sticky; bottom:0; z-index:3; background:var(--panel);
  border-top:1px solid var(--line); padding:10px 18px;
}
.helper-dock-label{font-size:.72rem; color:var(--sub); margin-bottom:6px;}
.helper-bar{
  display:flex; flex-wrap:wrap; gap:6px; max-height:70px; overflow-y:auto;
  border:1px dashed var(--line); border-radius:10px; padding:8px; background:var(--panel-2);
}
.helper-chip{
  background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px 11px;
  font-size:.78rem; color:var(--primary-dark);
}
.helper-chip.active{background:var(--primary-soft); border-color:var(--primary);}
.helper-chip.tone-step{color:#6B4C2E;}
.helper-chip.tone-group{color:var(--tag-fg);}

/* steps */
.step-card{
  border:1px solid var(--line); border-radius:12px; background:var(--panel-2);
  padding:10px 12px; margin-bottom:10px; position:relative;
}
.step-card .step-label{font-size:.72rem; color:var(--sub); font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between;}
.step-card textarea{
  width:100%; border:1px solid var(--line); border-radius:8px; background:#fff;
  padding:6px 8px; font-size:.88rem; resize:vertical; min-height:56px; outline:none;
}
.step-lines{
  background: repeating-linear-gradient(var(--panel-2), var(--panel-2) 27px, var(--line) 28px);
  line-height:28px; font-size:.88rem; white-space:pre-wrap; padding:0 2px;
}
.step-card .del-step{background:none;border:none;color:var(--danger);font-size:.75rem;}
.add-step-row{display:flex; justify-content:flex-end;}
.add-step-btn{
  background:var(--primary-soft); color:var(--primary-dark); border:none; border-radius:999px;
  width:34px; height:34px; font-size:1.1rem; box-shadow:var(--shadow);
}

@media (max-width:640px){
  .ing-columns{flex-direction:column;}
}

/* search view */
.search-cond{display:flex; flex-direction:column; gap:12px; margin-bottom:18px;}
.cond-row{display:flex; flex-direction:column; gap:5px;}
.cond-row label{font-size:.78rem; font-weight:700;}
.cond-row input{padding:10px 12px; border-radius:10px; border:1px solid; font-size:.9rem;}
.cond-and label{color:#2C6E63;}
.cond-and input{background:#E7F3EF; border-color:#9FD3C4;}
.cond-or label{color:#8A6A1E;}
.cond-or input{background:#FBF0D9; border-color:#E9CC8E;}
.cond-not label{color:#8B3A3A;}
.cond-not input{background:#F3E4E1; border-color:#E4C9C4;}

.tag-filter-chip{
  border-radius:999px; padding:5px 12px; font-size:.78rem; font-weight:500;
  background:var(--panel-2); color:var(--sub); border:1px solid var(--line);
}
.tag-filter-chip.state-and{background:#E7F3EF; color:#2C6E63; border-color:#9FD3C4;}
.tag-filter-chip.state-or{background:#FBF0D9; color:#8A6A1E; border-color:#E9CC8E;}
.tag-filter-chip.state-not{background:#F3E4E1; color:#8B3A3A; border-color:#E4C9C4;}
.tag-filter-chip b{font-weight:800; margin-left:3px;}

.fav-filter-row{display:flex; gap:6px; flex-wrap:wrap;}
.fav-filter-btn{
  border:1px solid var(--line); background:var(--panel-2); border-radius:999px;
  padding:7px 14px; font-size:.82rem; color:var(--sub);
}
.fav-filter-btn.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.save-slot-row{display:flex; gap:8px; flex-wrap:wrap;}
.save-slot{
  border:1px dashed var(--line); border-radius:10px; padding:9px 11px; font-size:.75rem;
  color:var(--sub); background:var(--panel-2); flex:1; min-width:170px;
}
.save-slot.filled{border-style:solid; color:var(--ink); background:var(--panel);}
.save-slot .slot-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.save-slot .slot-actions button{font-size:.7rem; padding:4px 9px;}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">レシピリスト<small id="updatedLine">最終更新: -</small></div>
    <nav>
      <button class="tab-btn active" id="tabListBtn" onclick="switchTab('list')">レシピ</button>
      <button class="tab-btn" id="tabSearchBtn" onclick="switchTab('search')">検索</button>
      <button class="tab-btn" id="tabMenuBtn" onclick="switchTab('menu')">献立</button>
      <button class="tab-btn" id="tabTagBtn" onclick="switchTab('tags')">タグ管理</button>
    </nav>
    <div style="display:flex; gap:6px;">
      <button class="tab-btn" onclick="exportData()">書き出し</button>
      <button class="tab-btn" onclick="document.getElementById('importFileInput').click()">読み込み</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none"
        onchange="if(this.files[0]){ importData(this.files[0]); } this.value='';">
    </div>
  </div>
</header>

<main>
  <section id="view-list">
    <div class="toolbar">
      <input type="text" class="search-box" id="quickFilter" placeholder="タイトルで絞り込み…" oninput="renderList()">
      <button class="btn" onclick="openRecipeModal()">＋ レシピ追加</button>
    </div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </section>

  <section id="view-search" hidden>
    <div class="search-cond">
      <div class="cond-row cond-and">
        <label>AND（すべて含む・カンマ区切り）</label>
        <input type="text" id="searchAnd" placeholder="例）鶏肉, 醤油" oninput="renderSearchResults()">
      </div>
      <div class="cond-row cond-or">
        <label>OR（いずれか含む・カンマ区切り）</label>
        <input type="text" id="searchOr" placeholder="例）豚肉, 牛肉" oninput="renderSearchResults()">
      </div>
      <div class="cond-row cond-not">
        <label>NOT（含まない・カンマ区切り）</label>
        <input type="text" id="searchNot" placeholder="例）辛い" oninput="renderSearchResults()">
      </div>
    </div>

    <div class="field">
      <label>タグで絞り込み（タップで指定なし→AND→OR→NOTと切替）</label>
      <div class="chip-row scroll-limited" id="searchTagChips"></div>
    </div>

    <div class="field">
      <label>お気に入り</label>
      <div class="fav-filter-row">
        <button class="fav-filter-btn active" data-val="all" onclick="setFavFilter('all')">すべて</button>
        <button class="fav-filter-btn" data-val="fav" onclick="setFavFilter('fav')">★お気に入りのみ</button>
        <button class="fav-filter-btn" data-val="nonfav" onclick="setFavFilter('nonfav')">☆お気に入り以外</button>
      </div>
    </div>

    <div class="field">
      <label>検索条件の保存（最大3件）</label>
      <div class="save-slot-row" id="saveSlotRow"></div>
    </div>

    <div class="recipe-grid" id="searchResultGrid"></div>
  </section>

  <section id="view-menu" hidden>
    <div class="toolbar">
      <div style="font-size:.8rem; color:var(--sub); flex:1;">献立リストは最大3件まで保存できます。</div>
      <button class="btn" id="addMenuBtn" onclick="addMenuList()">＋ 献立リスト追加</button>
    </div>
    <div class="recipe-grid" id="menuGrid"></div>
  </section>

  <section id="view-tags" hidden>
    <div class="toolbar">
      <input type="text" class="search-box" id="tagFilter" placeholder="タグを検索…" oninput="renderTagManage()">
    </div>
    <div class="field" style="max-width:340px;">
      <label>新しいタグを追加</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newTagInput" placeholder="タグ名を入力してEnter" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addNewTagFromManage();}">
        <button class="btn secondary" onclick="addNewTagFromManage()">追加</button>
      </div>
    </div>
    <div id="tagManageList"></div>
  </section>
</main>

<div class="overlay" id="modalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">レシピを追加</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>タイトル</label>
        <input type="text" id="f-title" placeholder="例）肉じゃが" oninput="renderTagCandidates()">
      </div>
      <div class="field fav-toggle">
        <label style="margin:0;">お気に入り</label>
        <button type="button" id="f-fav-btn" onclick="toggleFavField()">☆ お気に入りに追加</button>
      </div>
      <div class="field" id="f-dates" style="display:flex; gap:20px; font-size:.78rem; color:var(--sub);"></div>

      <div class="field">
        <label>タグ</label>
        <div class="tag-input-wrap" id="tagInputWrap">
          <input type="text" id="tagTextInput" placeholder="タグを入力してEnter"
            oninput="renderTagSuggest()" onfocus="renderTagSuggest()"
            onkeydown="onTagInputKeydown(event)">
        </div>
        <div class="tag-chip-list" id="tagChipList"></div>
        <div class="tag-candidate-area" id="tagCandidateArea"></div>
      </div>

      <div class="field">
        <label>材料</label>
        <div class="ing-columns" id="ingColumns"></div>
        <button class="btn secondary small" style="margin-top:6px;" onclick="addIngredientGroup()">＋ グループ追加</button>
      </div>

      <div class="field">
        <label>作り方</label>
        <div id="stepsWrap"></div>
        <div class="add-step-row"><button class="add-step-btn" onclick="addStep()">＋</button></div>
      </div>
    </div>
    <div class="helper-dock" id="helperDock">
      <div class="helper-dock-label" id="helperDockLabel"></div>
      <div class="helper-bar" id="helperDockChips"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="saveRecipe()">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="detailTitle"></h2>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn danger" onclick="deleteRecipeFromDetail()">削除</button>
      <button class="btn secondary" onclick="editFromDetail()">編集</button>
    </div>
  </div>
</div>

<div class="overlay" id="menuOverlay" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>献立リスト</h2>
      <button class="modal-close" onclick="closeMenuModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>リスト名</label>
        <input type="text" id="menu-name" oninput="updateMenuName(this.value)">
      </div>
      <div id="menuGroupsWrap"></div>
      <button class="btn secondary small" style="margin-top:6px;" onclick="addMenuGroup()">＋ グループ追加</button>
    </div>
    <div class="modal-foot">
      <button class="btn danger" onclick="deleteMenuList()">リストを削除</button>
      <button class="btn secondary" onclick="closeMenuModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ---------- storage ---------- */
const LS_RECIPES='recipeApp_recipes', LS_TAGS='recipeApp_tags', LS_UPDATED='recipeApp_lastUpdated', LS_MENUS='recipeApp_mealLists';
let recipes = JSON.parse(localStorage.getItem(LS_RECIPES) || '[]');
let tags = JSON.parse(localStorage.getItem(LS_TAGS) || '[]');
let mealLists = JSON.parse(localStorage.getItem(LS_MENUS) || '[]');

function nowJSTISO(){ return new Date().toISOString(); }
function formatJST(iso){
  if(!iso) return '-';
  try{
    return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
  }catch(e){ return iso; }
}
function touchUpdated(){ localStorage.setItem(LS_UPDATED, nowJSTISO()); renderUpdatedLine(); }
function renderUpdatedLine(){
  document.getElementById('updatedLine').textContent = '最終更新: ' + formatJST(localStorage.getItem(LS_UPDATED));
}
function saveAll(){
  localStorage.setItem(LS_RECIPES, JSON.stringify(recipes));
  localStorage.setItem(LS_TAGS, JSON.stringify(tags));
  touchUpdated();
}
function saveMealLists(){
  localStorage.setItem(LS_MENUS, JSON.stringify(mealLists));
  touchUpdated();
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(16).slice(2)); }

/* ---------- export / import ---------- */
async function exportData(){
  const data = { recipes, tags, mealLists, exportedAt: nowJSTISO() };
  const json = JSON.stringify(data, null, 2);
  const stamp = formatJST(nowJSTISO()).replace(/[/: ]/g,'-');
  const filename = `recipe-list-${stamp}.json`;

  // iOS Safari等は <a download> でのBlob保存が機能しないことが多いため、
  // 共有シート経由（ファイルに保存）をまず試す。
  if(window.isSecureContext && navigator.canShare){
    try{
      const file = new File([json], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
    }catch(err){
      if(err && err.name === 'AbortError') return; // 共有シートをキャンセルした場合は何もしない
      // それ以外のエラーは下のフォールバックへ
    }
  }
  // フォールバック：通常のダウンロード方式（PCブラウザなど）
  try{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){
    alert('書き出しに失敗しました。ブラウザやOSの設定をご確認ください。');
  }
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert('JSONとして読み込めませんでした。ファイルを確認してください。'); return; }
    if(!data || !Array.isArray(data.recipes)){ alert('レシピリストのデータ形式ではないようです。'); return; }
    const proceed = confirm(
      `${data.recipes.length}件のレシピを読み込みます。\n` +
      `同じIDのレシピは上書き、それ以外は追加されます。\n続けますか？`
    );
    if(!proceed) return;
    (data.tags||[]).forEach(t=>{
      if(!tags.some(x=>x.toLowerCase()===String(t).toLowerCase())) tags.push(t);
    });
    let added=0, updated=0;
    data.recipes.forEach(r=>{
      if(!r || !r.id || !r.title) return;
      const idx = recipes.findIndex(x=>x.id===r.id);
      if(idx>=0){ recipes[idx]=r; updated++; } else { recipes.push(r); added++; }
    });
    saveAll();
    if(Array.isArray(data.mealLists)){
      data.mealLists.forEach(m=>{
        if(!m || !m.id) return;
        const idx = mealLists.findIndex(x=>x.id===m.id);
        if(idx>=0) mealLists[idx]=m; else mealLists.push(m);
      });
      saveMealLists();
    }
    renderList(); renderTagManage();
    if(!document.getElementById('view-menu').hidden) renderMenuList();
    alert(`読み込み完了：追加 ${added}件 / 上書き ${updated}件`);
  };
  reader.readAsText(file);
}

function commitTagFromInput(){
  const input = document.getElementById('tagTextInput');
  const val = input.value.trim();
  if(!val) return;
  const existing = tags.find(t=>t.toLowerCase()===val.toLowerCase());
  const finalTag = existing || val;
  if(!existing){ tags.push(finalTag); }
  if(!curTagsChips.some(t=>t.toLowerCase()===finalTag.toLowerCase())){
    curTagsChips.push(finalTag);
  }
  input.value='';
  renderTagChips();
  hideTagSuggest();

/* タイトル・材料の内容に合わせたタグ候補 */
function renderTagCandidates(){
  const area = document.getElementById('tagCandidateArea');
  if(!area) return;
  const title = (document.getElementById('f-title')?.value || '').toLowerCase();
  const ingNames = curGroups.flatMap(g=>g.items.map(it=>it.name.trim().toLowerCase())).filter(Boolean);
  const textPool = [title, ...ingNames];
  const candidates = tags.filter(t=>{
    if(curTagsChips.some(c=>c.toLowerCase()===t.toLowerCase())) return false;
    const tl = t.toLowerCase();
    return textPool.some(s => s && (s.includes(tl) || tl.includes(s)));
  });
  if(candidates.length===0){ area.innerHTML=''; return; }
  area.innerHTML = `<div class="tag-candidate-label">内容から候補</div>` +
    candidates.map(t=>`<button type="button" class="tag-candidate-chip" onclick="selectTagSuggest('${t.replace(/'/g,"\\'")}')">＋ ${escapeHtml(t)}</button>`).join('');
}
function onTagInputKeydown(e){

}
function renderTagSuggest(){
  const input = document.getElementById('tagTextInput');
  const val = input.value.trim().toLowerCase();
  const wrap = document.getElementById('tagInputWrap');
  let box = document.getElementById('tagSuggestBox');
  const candidates = tags.filter(t => !curTagsChips.some(c=>c.toLowerCase()===t.toLowerCase()));
  let list;
  if(!val){ list = []; }
  else {
    const exact = candidates.filter(t=>t.toLowerCase()===val);
    const starts = candidates.filter(t=>t.toLowerCase().startsWith(val) && t.toLowerCase()!==val);
    const partial = candidates.filter(t=>t.toLowerCase().includes(val) && !t.toLowerCase().startsWith(val));
    list = [...exact, ...starts, ...partial].slice(0,8);
  }
  if(list.length===0){ hideTagSuggest(); return; }
  if(!box){ box = document.createElement('div'); box.id='tagSuggestBox'; box.className='tag-suggest'; wrap.appendChild(box); }
  box.innerHTML = list.map(t=>`<div onclick="selectTagSuggest('${t.replace(/'/g,"\\'")}')">${escapeHtml(t)}</div>`).join('');
}

  if(!curTagsChips.some(c=>c.toLowerCase()===t.toLowerCase())) curTagsChips.push(t);

/* 詳細表示（閲覧）専用：画面幅に応じてグループ単位で2カラムに振り分け（グループなしは常に左カラム先頭固定） */
function balanceGroupsIntoColumns(groups){
  const noGroupIdx = groups.findIndex(g => !(g.group||'').trim());
  const restIdx = groups.map((g,i)=>i).filter(i=>i!==noGroupIdx);
  const wide = window.matchMedia('(min-width:641px)').matches;
  if(!wide){
    const order = noGroupIdx>=0 ? [noGroupIdx, ...restIdx] : restIdx;
    return [order, []];
  }
  const sizes = groups.map(g=>Math.max(1,(g.items||[]).length));
  const sortedRest = [...restIdx].sort((a,b)=>sizes[b]-sizes[a]);
  let col1=[], col2=[];
  let load1=0, load2=0;
  if(noGroupIdx>=0){ col1.push(noGroupIdx); load1+=sizes[noGroupIdx]; }
  sortedRest.forEach(i=>{
    if(load1<=load2){ col1.push(i); load1+=sizes[i]; } else { col2.push(i); load2+=sizes[i]; }
  });
  const col1Rest = col1.filter(i=>i!==noGroupIdx).sort((a,b)=>a-b);
  col1 = noGroupIdx>=0 ? [noGroupIdx, ...col1Rest] : col1Rest;
  col2.sort((a,b)=>a-b);
  return [col1, col2];
}

const AMOUNT_HELPERS = ['大さじ','小さじ','／','g','ml','少々'];
let helperContext = 'amount'; // 'amount' | 'step'
function setHelperContext(ctx){ helperContext = ctx; renderHelperDock(); }
function renderHelperDock(){
  const label = document.getElementById('helperDockLabel');
  const chips = document.getElementById('helperDockChips');
  if(!label || !chips) return;
  if(helperContext==='step'){
    label.textContent = '手順の入力補助（テキストエリアをタップしてから選択）';
    const ingredientNames = [...new Set(curGroups.flatMap(g=>g.items.map(it=>it.name.trim()).filter(Boolean)))];
    const groupNames = [...new Set(curGroups.map(g=>g.group.trim()).filter(Boolean))];
    const stepLabels = curSteps.map((_,i)=>`手順${i+1}`);
    chips.innerHTML =
      ingredientNames.map(n=>`<button type="button" class="helper-chip" onclick="applyStepHelper('${n.replace(/'/g,"\\'")}')">${escapeHtml(n)}</button>`).join('') +
      groupNames.map(n=>`<button type="button" class="helper-chip tone-group" onclick="applyStepHelper('${n.replace(/'/g,"\\'")}')">${escapeHtml(n)}</button>`).join('') +
      stepLabels.map(n=>`<button type="button" class="helper-chip tone-step" onclick="applyStepHelper('${n}')">${n}</button>`).join('');
  } else {
    label.textContent = '分量の入力補助（欄をタップしてから選択）';
    chips.innerHTML = AMOUNT_HELPERS.map(h=>
      `<button type="button" class="helper-chip" onclick="applyAmountHelper('${h}')">${h}</button>`).join('');
  }
}
function applyAmountHelper(text){
  const input = lastFocusedAmountInput;
  if(!input){ alert('先に分量欄をタップして選択してください。'); return; }
  const start = input.selectionStart ?? input.value.length;
  const before = input.value.slice(0, start);
  if(before.endsWith(text)){
    input.value = before.slice(0, before.length-text.length) + input.value.slice(start);
    const pos = before.length-text.length;
    input.setSelectionRange(pos,pos);
  } else {
    input.value = before + text + input.value.slice(start);
    const pos = start + text.length;
    input.setSelectionRange(pos,pos);
  }
  input.focus();
  const evt = new Event('input', {bubbles:true});
  input.dispatchEvent(evt);
}

function addStep(){ curSteps.push(''); renderSteps(); renderHelperDock(); }
function removeStep(i){

  renderSteps(); renderHelperDock();

function updateStep(i,val){ curSteps[i]=val; }
function renderSteps(){
  document.getElementById('stepsWrap').innerHTML = curSteps.map((s,i)=>`
    <div class="step-card">
      <div class="step-label"><span>手順${i+1}</span><button class="del-step" onclick="removeStep(${i})">削除</button></div>

        oninput="updateStep(${i}, this.value)">${escapeHtml(s)}</textarea>
    </div>`).join('');

function applyStepHelper(text){
  const ta = lastFocusedStepTextarea;
  if(!ta){ alert('先に作り方の入力欄をタップしてください。'); return; }
  const start = ta.selectionStart ?? ta.value.length;
  const end = ta.selectionEnd ?? ta.value.length;
  ta.value = ta.value.slice(0,start) + text + ta.value.slice(end);
  const pos = start + text.length;
  ta.setSelectionRange(pos,pos);
  ta.focus();
  const idx = [...document.querySelectorAll('#stepsWrap textarea')].indexOf(ta);
  if(idx>=0) curSteps[idx] = ta.value;

/* ---- save recipe ---- */
function saveRecipe(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ alert('タイトルを入力してください。'); return; }
  const cleanGroups = curGroups
    .map(g=>({group:g.group.trim(), items: g.items.filter(it=>it.name.trim()||it.amount.trim()).map(it=>({name:it.name.trim(), amount:it.amount.trim()}))}))
    .filter(g=>g.items.length>0);
  const cleanSteps = curSteps.map(s=>s.trim()).filter(s=>s.length>0);
  const nowIso = nowJSTISO();

  if(editingRecipeId){
    const r = recipes.find(x=>x.id===editingRecipeId);
    r.title=title; r.favorite=curFavorite; r.tags=[...curTagsChips];
    r.ingredientGroups=cleanGroups; r.steps=cleanSteps; r.updatedAt=nowIso;
  } else {
    recipes.push({
      id: uid(), title, favorite: curFavorite, tags:[...curTagsChips],
      ingredientGroups: cleanGroups, steps: cleanSteps,
      createdAt: nowIso, updatedAt: nowIso
    });
  }
  saveAll();
  closeModal();
  renderList();
}

}
function updateMenuName(val){
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  m.name = val; saveMealLists();
}
function addMenuGroup(){
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  m.groups.push({name:'', recipeIds:[]});
  saveMealLists(); renderMenuGroups();
}
function removeMenuGroup(gi){
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  m.groups.splice(gi,1);
  if(m.groups.length===0) m.groups.push({name:'', recipeIds:[]});
  saveMealLists(); renderMenuGroups();
}
function updateMenuGroupName(gi, val){
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  m.groups[gi].name = val; saveMealLists();
}
function removeRecipeFromGroup(gi, rid){
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  m.groups[gi].recipeIds = m.groups[gi].recipeIds.filter(x=>x!==rid);
  saveMealLists(); renderMenuGroups();
}
function addRecipeToGroup(gi, rid){
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  if(!m.groups[gi].recipeIds.includes(rid)) m.groups[gi].recipeIds.push(rid);
  saveMealLists(); renderMenuGroups();
}
function renderMenuGroups(){
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  const wrap = document.getElementById('menuGroupsWrap');
  wrap.innerHTML = m.groups.map((g,gi)=>{
    const chips = (g.recipeIds||[]).map(rid=>{
      const r = recipes.find(x=>x.id===rid);
      const title = r ? r.title : '(削除済みレシピ)';
      const titleHtml = r
        ? `<span style="cursor:pointer;" onclick="openDetail('${rid}')">${escapeHtml(title)}</span>`
        : `<span style="color:var(--sub);">${escapeHtml(title)}</span>`;
      return `<span class="tag-chip">${titleHtml} <span class="x" onclick="event.stopPropagation(); removeRecipeFromGroup(${gi},'${rid}')">×</span></span>`;
    }).join('') || '<span style="color:var(--sub);font-size:.8rem;">まだレシピがありません</span>';
    return `
    <div class="ing-group" style="margin-bottom:12px;">
      <div class="ing-group-head">
        <input type="text" placeholder="グループ名（空欄可）" value="${escapeHtml(g.name)}" oninput="updateMenuGroupName(${gi}, this.value)">
        <button class="btn ghost" onclick="removeMenuGroup(${gi})" style="margin-left:auto;">グループ削除</button>
      </div>
      <div class="chip-row" style="margin-bottom:8px;">${chips}</div>
      <div class="tag-input-wrap" style="position:relative;">
        <input type="text" placeholder="レシピ名で検索して追加" oninput="renderMenuRecipeSuggest(${gi}, this.value)" onfocus="renderMenuRecipeSuggest(${gi}, this.value)">
        <div class="tag-suggest" id="menuSuggest-${gi}"></div>
      </div>
    </div>`;
  }).join('');
}
function renderMenuRecipeSuggest(gi, query){
  const box = document.getElementById(`menuSuggest-${gi}`);
  if(!box) return;
  const m = mealLists.find(x=>x.id===curMenuId); if(!m) return;
  const q = query.trim().toLowerCase();
  const already = new Set(m.groups[gi].recipeIds);
  const candidates = recipes.filter(r=>!already.has(r.id));
  let list;
  if(!q){ list = candidates.slice(0,8); }
  else{
    const exact = candidates.filter(r=>r.title.toLowerCase()===q);
    const starts = candidates.filter(r=>r.title.toLowerCase().startsWith(q) && r.title.toLowerCase()!==q);
    const partial = candidates.filter(r=>r.title.toLowerCase().includes(q) && !r.title.toLowerCase().startsWith(q));
    list = [...exact, ...starts, ...partial].slice(0,8);
  }
  if(list.length===0){ box.innerHTML=''; return; }
  box.innerHTML = list.map(r=>`<div onclick="addRecipeToGroup(${gi}, '${r.id}'); this.parentElement.innerHTML='';">${escapeHtml(r.title)}</div>`).join('');
}
function deleteMenuList(){
  if(!curMenuId) return;
  if(!confirm('この献立リストを削除しますか？')) return;
  mealLists = mealLists.filter(x=>x.id!==curMenuId);
  saveMealLists();
  document.getElementById('menuOverlay').hidden = true;
  curMenuId = null;
  renderMenuList();
}

/* ---------- add-to-menu widget (recipe detail) ---------- */
function renderAddToMenuArea(recipeId){
  const area = document.getElementById('addToMenuArea');
  if(!area) return;
  if(mealLists.length===0){
    area.innerHTML = '<div style="font-size:.8rem;color:var(--sub);">「献立」タブでリストを作成すると、ここから追加できます。</div>';
    return;
  }
  area.innerHTML = `
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
      <select id="addToMenuListSel" onchange="refreshAddToMenuGroupOptions()" style="padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:.85rem;">
        ${mealLists.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('')}
      </select>
      <select id="addToMenuGroupSel" style="padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:.85rem;"></select>
      <button class="btn secondary small" onclick="addCurrentRecipeToMenu('${recipeId}')">追加</button>
    </div>`;
  refreshAddToMenuGroupOptions();
}
function refreshAddToMenuGroupOptions(){
  const sel = document.getElementById('addToMenuListSel');
  const gsel = document.getElementById('addToMenuGroupSel');
  if(!sel || !gsel) return;
  const m = mealLists.find(x=>x.id===sel.value);
  gsel.innerHTML = (m ? m.groups : []).map((g,gi)=>`<option value="${gi}">${g.name ? escapeHtml(g.name) : '(グループなし)'}</option>`).join('');
}
function addCurrentRecipeToMenu(recipeId){
  const listId = document.getElementById('addToMenuListSel').value;
  const gi = parseInt(document.getElementById('addToMenuGroupSel').value, 10);
  const m = mealLists.find(x=>x.id===listId);
  if(!m || !m.groups[gi]) return;
  if(!m.groups[gi].recipeIds.includes(recipeId)) m.groups[gi].recipeIds.push(recipeId);
  saveMealLists();
  alert(`「${m.name}」に追加しました。`);
}

/* ---------- search ---------- */
let searchTagStates = {}; // tagName -> 'and'|'or'|'not'
let favFilter = 'all';
let savedSearches = JSON.parse(localStorage.getItem('recipeApp_savedSearches') || '[null,null,null]');

function splitWords(str){
  return String(str||'').split(/[,、\s]+/).map(s=>s.trim()).filter(Boolean);
}
function recipeSearchAllText(r){
  const title = r.title||'';
  const ing = (r.ingredientGroups||[]).flatMap(g=>g.items.map(it=>`${it.name} ${it.amount} ${g.group||''}`)).join(' ');
  const steps = (r.steps||[]).join(' ');
  const tagsText = (r.tags||[]).join(' ');
  return `${title} ${ing} ${steps} ${tagsText}`.toLowerCase();
}
function recipeMatchesWord(r, word){
  return recipeSearchAllText(r).includes(word.toLowerCase());
}
function renderSearchTagChips(){
  const container = document.getElementById('searchTagChips');
  if(!container) return;
  if(tags.length===0){ container.innerHTML = '<span style="color:var(--sub);font-size:.8rem;">タグがまだありません</span>'; return; }
  container.innerHTML = tags.map(t=>{
    const state = searchTagStates[t] || 'none';
    const label = state==='and' ? 'AND' : state==='or' ? 'OR' : state==='not' ? 'NOT' : '';
    return `<button type="button" class="tag-filter-chip state-${state}" onclick="cycleTagFilter('${t.replace(/'/g,"\\'")}')">${escapeHtml(t)}${label?` <b>${label}</b>`:''}</button>`;
  }).join('');
}
function cycleTagFilter(t){
  const order = [undefined,'and','or','not'];
  const idx = order.indexOf(searchTagStates[t]);
  const next = order[(idx+1) % order.length];
  if(next===undefined) delete searchTagStates[t]; else searchTagStates[t]=next;
  renderSearchTagChips();
  renderSearchResults();
}
function setFavFilter(v){
  favFilter = v;
  document.querySelectorAll('.fav-filter-btn').forEach(b=>b.classList.toggle('active', b.dataset.val===v));
  renderSearchResults();
}
function getCurrentSearchCondition(){
  return {
    and: document.getElementById('searchAnd').value,
    or: document.getElementById('searchOr').value,
    not: document.getElementById('searchNot').value,
    tagStates: {...searchTagStates},
    favFilter
  };
}
function applySearchCondition(cond){
  document.getElementById('searchAnd').value = cond.and||'';
  document.getElementById('searchOr').value = cond.or||'';
  document.getElementById('searchNot').value = cond.not||'';
  searchTagStates = {...(cond.tagStates||{})};
  favFilter = cond.favFilter||'all';
  document.querySelectorAll('.fav-filter-btn').forEach(b=>b.classList.toggle('active', b.dataset.val===favFilter));
  renderSearchTagChips();
  renderSearchResults();
}
function summarizeCondition(cond){
  const parts = [];
  if(cond.and && cond.and.trim()) parts.push('AND:'+cond.and.trim());
  if(cond.or && cond.or.trim()) parts.push('OR:'+cond.or.trim());
  if(cond.not && cond.not.trim()) parts.push('NOT:'+cond.not.trim());
  const tagParts = Object.entries(cond.tagStates||{}).map(([t,s])=>`${s.toUpperCase()}:#${t}`);
  if(tagParts.length) parts.push(tagParts.join(' '));
  if(cond.favFilter && cond.favFilter!=='all') parts.push(cond.favFilter==='fav' ? '★のみ' : '☆以外');
  return parts.length ? parts.join(' / ') : '(条件なし)';
}
function renderSaveSlots(){
  const row = document.getElementById('saveSlotRow');
  if(!row) return;
  row.innerHTML = [0,1,2].map(i=>{
    const s = savedSearches[i];
    return `
    <div class="save-slot ${s?'filled':''}">
      <div>${i+1}. ${s ? escapeHtml(summarizeCondition(s)) : '(空き)'}</div>
      <div class="slot-actions">
        <button class="btn secondary small" onclick="saveToSlot(${i})">現在の条件を保存</button>
        ${s ? `<button class="btn secondary small" onclick="loadSlot(${i})">呼び出す</button><button class="btn ghost" onclick="clearSlot(${i})">削除</button>` : ''}
      </div>
    </div>`;
  }).join('');
}
function saveToSlot(i){
  if(savedSearches[i] && !confirm('この保存枠を上書きしますか？')) return;
  savedSearches[i] = getCurrentSearchCondition();
  localStorage.setItem('recipeApp_savedSearches', JSON.stringify(savedSearches));
  renderSaveSlots();
}
function loadSlot(i){
  if(!savedSearches[i]) return;
  applySearchCondition(savedSearches[i]);
}
function clearSlot(i){
  savedSearches[i] = null;
  localStorage.setItem('recipeApp_savedSearches', JSON.stringify(savedSearches));
  renderSaveSlots();
}
function renderSearchResults(){
  const andWords = splitWords(document.getElementById('searchAnd').value);
  const orWords = splitWords(document.getElementById('searchOr').value);
  const notWords = splitWords(document.getElementById('searchNot').value);
  const andTags = Object.entries(searchTagStates).filter(([,s])=>s==='and').map(([t])=>t);
  const orTags = Object.entries(searchTagStates).filter(([,s])=>s==='or').map(([t])=>t);
  const notTags = Object.entries(searchTagStates).filter(([,s])=>s==='not').map(([t])=>t);

  const filtered = recipes.filter(r=>{
    if(favFilter==='fav' && !r.favorite) return false;
    if(favFilter==='nonfav' && r.favorite) return false;
    if(andWords.some(w=>!recipeMatchesWord(r,w))) return false;
    if(orWords.length && !orWords.some(w=>recipeMatchesWord(r,w))) return false;
    if(notWords.some(w=>recipeMatchesWord(r,w))) return false;
    const rtags = (r.tags||[]).map(t=>t.toLowerCase());
    if(andTags.some(t=>!rtags.includes(t.toLowerCase()))) return false;
    if(orTags.length && !orTags.some(t=>rtags.includes(t.toLowerCase()))) return false;
    if(notTags.some(t=>rtags.includes(t.toLowerCase()))) return false;
    return true;
  });

  const grid = document.getElementById('searchResultGrid');
  if(!grid) return;
  if(filtered.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">条件に一致するレシピが見つかりません。</div>`;
    return;
  }
  grid.innerHTML = filtered.map(r => `
    <div class="recipe-card" onclick="openDetail('${r.id}')">
      <button class="fav-star ${r.favorite?'on':''}" onclick="event.stopPropagation(); quickToggleFav('${r.id}')">${r.favorite?'★':'☆'}</button>
      <h3>${escapeHtml(r.title)}</h3>
      <div class="meta">更新: ${formatJST(r.updatedAt)}</div>
      <div class="chip-row">${(r.tags||[]).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>
    </div>
  `).join('');
}

/* ---------- tag management page ---------- */
function tagUsageCount(t){ return recipes.filter(r=>(r.tags||[]).some(x=>x.toLowerCase()===t.toLowerCase())).length; }
function renderTagManage(){
  const q = document.getElementById('tagFilter').value.trim().toLowerCase();
  let list = [...tags];
  if(q){
    const exact = list.filter(t=>t.toLowerCase()===q);
    const starts = list.filter(t=>t.toLowerCase().startsWith(q) && t.toLowerCase()!==q);
    const partial = list.filter(t=>t.toLowerCase().includes(q) && !t.toLowerCase().startsWith(q));
    list = [...exact, ...starts, ...partial];
  }
  const el = document.getElementById('tagManageList');
  if(list.length===0){ el.innerHTML = `<div class="empty-state">タグがありません。</div>`; return; }
  el.innerHTML = list.map(t=>`
    <div style="display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);">
      <input type="text" value="${escapeHtml(t)}" style="flex:1; border:none; background:transparent; font-size:.9rem; border-bottom:1px dashed transparent; padding:4px;"
        onfocus="this.style.borderBottomColor='var(--line)'"
        onblur="this.style.borderBottomColor='transparent'; renameTagIfChanged('${t.replace(/'/g,"\\'")}', this.value)">
      <span style="font-size:.72rem; color:var(--sub); white-space:nowrap;">${tagUsageCount(t)}件で使用</span>
      <button class="btn ghost" style="color:var(--danger);" onclick="deleteTag('${t.replace(/'/g,"\\'")}')">削除</button>
    </div>
  `).join('');
}
function addNewTagFromManage(){
  const input = document.getElementById('newTagInput');
  const val = input.value.trim();
  if(!val) return;
  if(tags.some(t=>t.toLowerCase()===val.toLowerCase())){ alert('同じ名前のタグが既に存在します。'); return; }
  tags.push(val); input.value=''; saveAll(); renderTagManage();
}
function renameTagIfChanged(oldName, newVal){
  const val = newVal.trim();
  if(!val || val===oldName) { renderTagManage(); return; }
  if(tags.some(t=>t.toLowerCase()===val.toLowerCase() && t.toLowerCase()!==oldName.toLowerCase())){
    alert('同じ名前のタグが既に存在します。'); renderTagManage(); return;
  }
  const idx = tags.findIndex(t=>t===oldName);
  if(idx>=0) tags[idx]=val;
  recipes.forEach(r=>{ r.tags = (r.tags||[]).map(t=> t===oldName ? val : t); });
  saveAll(); renderTagManage();
}
function deleteTag(t){
  if(!confirm(`タグ「${t}」を削除しますか？（レシピからも削除されます）`)) return;
  tags = tags.filter(x=>x!==t);
  recipes.forEach(r=>{ r.tags = (r.tags||[]).filter(x=>x!==t); });
  saveAll(); renderTagManage();
}

/* ---------- init ---------- */
document.addEventListener('click', (e)=>{
  const wrap = document.getElementById('tagInputWrap');
  if(wrap && !wrap.contains(e.target)) hideTagSuggest();
});
window.addEventListener('resize', ()=>{ if(!document.getElementById('modalOverlay').hidden) renderIngredients(); });

renderUpdatedLine();
renderList();
</script>
