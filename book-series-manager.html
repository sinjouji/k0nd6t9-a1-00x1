<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>シリーズ本棚</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg:        #f5efe6;
  --bg2:       #ede4d6;
  --card:      #fffdf9;
  --br1:       #3d2b1f;
  --br2:       #5c3d2e;
  --br3:       #8b6347;
  --br4:       #c8a97e;
  --br5:       #e8d8c4;
  --owned:     #4a7c59;
  --owned-bg:  #e8f4e8;
  --miss:      #a05c00;
  --miss-bg:   #fff3cd;
  --red:       #c0392b;
  --radius:    12px;
  --radius-sm: 8px;
  --shadow:    0 2px 8px rgba(61,43,31,.12);
  --shadow-lg: 0 8px 32px rgba(61,43,31,.18);
  --header-h:  56px;
  --bottom-nav:72px;
  --safe-b:    env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--br2);font-family:-apple-system,'Hiragino Sans','YuGothic',sans-serif;font-size:15px;line-height:1.6; touch-action: pan-y; overflow-x:hidden;}


/* ===== LAYOUT ===== */
#app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;position:relative;}
.header{height:var(--header-h);background:var(--br1);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100;}
.header h1{font-size:17px;font-weight:700;flex:1;letter-spacing:.02em;}
.header-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.9;border-radius:6px;}
.header-btn:active{opacity:.6;}
.main{flex:1;overflow-y:auto;padding:12px 12px calc(var(--bottom-nav) + var(--safe-b) + 12px);-webkit-overflow-scrolling:touch;}
.nav{height:var(--bottom-nav);padding-bottom:var(--safe-b);background:var(--br1);display:flex;border-top:1px solid rgba(255,255,255,.1);position:sticky;bottom:0;z-index:100;min-height:72px;height:calc(72px + var(--safe-b));}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;color:rgba(255,255,255,.6);font-size:10px;gap:3px;cursor:pointer;transition:color .15s;padding-top:6px;padding-bottom:6px;}
.nav-btn.active{color:#fff;}
.nav-icon{font-size:20px;line-height:1;}

/* ===== PAGES ===== */
.page{display:none;}.page.active{display:block;}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
.card-body{padding:14px 16px;}
.card-tap{cursor:pointer;}
.card-tap:active{opacity:.75;}

/* ===== HOME ===== */
.series-card{cursor:pointer;}
.series-card:active{opacity:.8;}
.series-card .card-body{padding:14px 16px 12px;}
.series-name{font-size:16px;font-weight:700;color:var(--br1);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.series-stats{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--br3);margin-bottom:8px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;gap:3px;}
.badge-owned{background:var(--owned-bg);color:var(--owned);}
.badge-miss{background:var(--miss-bg);color:var(--miss);}
.badge-total{background:var(--bg2);color:var(--br3);}
/* 背表紙バー（シグネチャ要素） */
.spine-bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-bottom:8px;}
.spine-bar-fill{height:100%;background:linear-gradient(90deg,var(--br3),var(--br4));border-radius:4px;transition:width .4s ease;}
.next-buy{font-size:13px;color:var(--br2);display:flex;align-items:flex-start;gap:6px;}
.next-buy-label{color:var(--br4);font-weight:600;flex-shrink:0;}
.next-buy-title{color:var(--br2);}
.memo-icon-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px;line-height:1;opacity:.65;flex-shrink:0;}
.memo-icon-btn:active{opacity:.4;}
.empty-state{text-align:center;padding:48px 24px;color:var(--br3);}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty-state p{font-size:14px;line-height:1.7;}

/* ===== FAB ===== */
.fab{position:fixed;bottom:calc(var(--bottom-nav) + var(--safe-b) + 16px);right:calc(50% - 270px + 16px);background:var(--br1);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:26px;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;z-index:50;transition:transform .15s;}
.fab:active{transform:scale(.93);}
@media(max-width:540px){.fab{right:16px;}}

/* ===== SERIES DETAIL ===== */
.detail-hero{background:var(--br1);color:#fff;padding:16px 16px 12px;}
.detail-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.detail-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.detail-next{font-size:13px;color:rgba(255,255,255,.75);display:flex;gap:6px;flex-wrap:wrap;}
.detail-next-label{color:var(--br4);font-weight:600;}
.detail-memo{font-size:13px;color:rgba(255,255,255,.8);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);white-space:pre-wrap;}
.detail-memo-toggle{background:none;border:none;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;padding:0;margin-top:6px;display:flex;align-items:center;gap:4px;}
.detail-memo-toggle:active{opacity:.6;}

.group-section{margin-bottom:12px;}
.group-header{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;}
.group-name{font-size:14px;font-weight:700;color:var(--br2);flex:1;}
.group-stats{font-size:12px;color:var(--br3);}
.group-memo-text{font-size:12px;color:var(--br3);padding:4px 16px 8px;background:var(--bg2);white-space:pre-wrap;}
.group-memo-toggle{background:none;border:none;color:var(--br4);font-size:12px;cursor:pointer;padding:0;}

.book-list{background:var(--card);border-radius:0 0 var(--radius) var(--radius);overflow:hidden;}
.book-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bg2);cursor:pointer;transition:background .1s;}
.book-item:last-child{border-bottom:none;}
.book-item:active{background:var(--bg2);}
.book-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--br4);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:.15s;}
.book-check.owned{background:var(--owned);border-color:var(--owned);color:#fff;}
.book-num{font-size:12px;color:var(--br3);min-width:40px;flex-shrink:0;}
.book-title{font-size:14px;color:var(--br2);flex:1;}
.book-memo-icon{font-size:14px;opacity:.5;flex-shrink:0;}
.miss-list{padding:12px 16px;background:var(--miss-bg);border-radius:var(--radius);margin-bottom:12px;}
.miss-list-title{font-size:13px;font-weight:700;color:var(--miss);margin-bottom:6px;}
.miss-list-items{font-size:13px;color:var(--miss);line-height:1.8;}

/* ===== BOOK BUBBLE ===== */
.bubble-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;background:transparent;}
.bubble-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3);}
.bubble{position:relative;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:540px;margin:0 auto;box-shadow:var(--shadow-lg);z-index:1;animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.bubble-title{font-size:15px;font-weight:700;color:var(--br1);margin-bottom:4px;}
.bubble-num{font-size:13px;color:var(--br3);margin-bottom:8px;}
.bubble-memo{font-size:14px;color:var(--br2);white-space:pre-wrap;line-height:1.7;}
.bubble-no-memo{font-size:14px;color:var(--br4);font-style:italic;}

/* ===== BOTTOM SHEET (メモ用) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);}
.sheet{position:relative;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:540px;margin:0 auto;box-shadow:var(--shadow-lg);z-index:1;animation:slideUp .22s ease;max-height:60vh;overflow-y:auto;}
.sheet-title{font-size:15px;font-weight:700;color:var(--br1);margin-bottom:12px;}
.sheet-memo{font-size:14px;color:var(--br2);white-space:pre-wrap;line-height:1.8;}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;overscroll-behavior:contain;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);}
.modal{position:relative;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:540px;margin:0 auto;box-shadow:var(--shadow-lg);z-index:1;animation:slideUp .22s ease;max-height:85vh;display:flex;flex-direction:column; min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;}
.modal-head{display:flex;align-items:center;margin-bottom:16px;}
.modal-title{font-size:16px;font-weight:700;color:var(--br1);flex:1;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--br3);padding:2px;line-height:1;}
.modal-close:active{opacity:.6;}
.modal-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.modal-foot{margin-top:16px;display:flex;gap:10px;justify-content:flex-end;}

/* ===== FORM ===== */
.form-group{margin-bottom:14px;}
label{display:block;font-size:13px;color:var(--br3);font-weight:600;margin-bottom:5px;}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--br5);border-radius:var(--radius-sm);padding:9px 12px;font-size:15px;color:var(--br1);background:#fff;outline:none;font-family:inherit;}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--br3);}
textarea{resize:vertical;min-height:72px;}
.btn{padding:9px 20px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
.btn:active{opacity:.75;}
.btn-primary{background:var(--br1);color:#fff;}
.btn-ghost{background:transparent;color:var(--br3);border:1.5px solid var(--br5);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:6px 14px;font-size:13px;}
.btn-icon{background:none;border:none;cursor:pointer;font-size:18px;padding:4px;line-height:1;color:var(--br3);}
.btn-icon:active{opacity:.6;}

/* ===== DIVIDER ===== */
.divider{height:1px;background:var(--bg2);margin:12px 0;}

/* ===== SETTINGS ===== */
.settings-section{margin-bottom:20px;}
.settings-title{font-size:13px;font-weight:700;color:var(--br3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding:0 4px;}
.settings-item{background:var(--card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:6px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow);}
.settings-item:active{opacity:.75;}
.settings-item-icon{font-size:20px;width:28px;text-align:center;}
.settings-item-text{flex:1;}
.settings-item-label{font-size:15px;font-weight:600;color:var(--br2);}
.settings-item-desc{font-size:12px;color:var(--br3);margin-top:2px;}
.settings-item-arrow{color:var(--br4);font-size:16px;}

/* ===== CONFIRM ===== */
.confirm-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.confirm-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);}
.confirm-box{position:relative;background:var(--card);border-radius:var(--radius);padding:24px 20px;width:100%;max-width:320px;box-shadow:var(--shadow-lg);z-index:1;}
.confirm-title{font-size:16px;font-weight:700;color:var(--br1);margin-bottom:8px;}
.confirm-msg{font-size:14px;color:var(--br3);margin-bottom:20px;line-height:1.6;}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end;}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:calc(var(--bottom-nav) + var(--safe-b) + 16px);left:50%;transform:translateX(-50%);background:var(--br1);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:500;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* ===== ADD BOOK INLINE ===== */
.add-book-row{display:flex;gap:8px;padding:10px 12px;background:var(--bg2);border-radius:0 0 var(--radius) var(--radius);}
.add-book-row input{flex:1;min-width:0;}
.add-book-row input:first-child{max-width:72px;}

/* ===== DRAG HANDLE (sort indicator) ===== */
.drag-hint{color:var(--br5);font-size:16px;flex-shrink:0;cursor:grab;}

/* ===== DETAIL ACTION BAR ===== */
.action-bar{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--bg2);}
.action-bar::-webkit-scrollbar{display:none;}
.action-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;border:1.5px solid var(--br5);background:var(--card);color:var(--br2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.action-chip:active{background:var(--bg2);}
.action-chip.active{background:var(--br1);color:#fff;border-color:var(--br1);}

/* ===== BULK CANDIDATE MODAL ===== */
.bulk-modal{max-height:90vh;}
.bulk-modal > div{
  display:flex;
  flex-direction:column;
  min-height:0;
  max-height:85vh;
}
.bulk-modal .modal-body{
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.bulk-target-bar{background:var(--bg2);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.bulk-target-label{font-size:13px;color:var(--br3);font-weight:600;flex-shrink:0;}
.bulk-target-bar select{flex:1;min-width:140px;padding:6px 10px;font-size:14px;}
.bulk-sel-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.bulk-sel-count{font-size:13px;color:var(--br3);flex:1;}
.bulk-cand-list{display:flex;flex-direction:column;gap:6px;}
.cand-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid transparent;cursor:pointer;transition:background .1s;position:relative;}
.cand-item:active{opacity:.8;}
.cand-item.conf-high{background:#f0faf3;border-color:#b2dfc1;}
.cand-item.conf-medium{background:#fffbea;border-color:#f0d98a;}
.cand-item.conf-low{background:#fff2f0;border-color:#f5bcb4;}
.cand-item.is-dup{opacity:.6;}
.cand-item.is-dup .cand-title{text-decoration:line-through;}
.cand-cb{width:20px;height:20px;border-radius:4px;border:2px solid var(--br4);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px;background:#fff;}
.cand-cb.checked{background:var(--br1);border-color:var(--br1);color:#fff;}
.cand-body{flex:1;min-width:0;}
.cand-num{font-size:12px;color:var(--br3);margin-bottom:1px;}
.cand-title{font-size:14px;font-weight:600;color:var(--br1);word-break:break-all;}
.cand-meta{font-size:11px;color:var(--br3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
.cand-reason{font-size:10px;color:var(--br3);margin-top:2px;font-style:italic;line-height:1.4;}
.cand-conf{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;flex-shrink:0;align-self:flex-start;margin-top:3px;}
.conf-high .cand-conf{background:#b2dfc1;color:#1a5c35;}
.conf-medium .cand-conf{background:#f0d98a;color:#6b4c00;}
.conf-low .cand-conf{background:#f5bcb4;color:#7a1a10;}
.cand-dup-badge{font-size:10px;background:var(--bg2);color:var(--br3);padding:1px 6px;border-radius:10px;margin-left:4px;}
.bulk-empty{text-align:center;padding:32px 0;color:var(--br3);font-size:14px;}
.bulk-foot{margin-top:14px;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.bulk-added-count{font-size:13px;color:var(--br3);flex:1;}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header class="header" id="header">
    <h1 id="headerTitle">📚 シリーズ本棚</h1>
    <button class="header-btn" id="headerActionBtn" style="display:none" title="編集"></button>
    <button class="header-btn" id="headerBackBtn" style="display:none" title="戻る">←</button>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <!-- HOME -->
    <div class="page active" id="pageHome">
      <div id="seriesList"></div>
    </div>
    <!-- DETAIL -->
    <div class="page" id="pageDetail">
      <div id="detailContent"></div>
    </div>
    <!-- SETTINGS -->
    <div class="page" id="pageSettings">
      <div class="settings-section">
        <div class="settings-title">データ管理</div>
        <div class="settings-item" onclick="exportData()">
          <span class="settings-item-icon">📤</span>
          <div class="settings-item-text">
            <div class="settings-item-label">JSONエクスポート</div>
            <div class="settings-item-desc">データをJSONファイルで保存</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </div>
        <div class="settings-item" onclick="importData()">
          <span class="settings-item-icon">📥</span>
          <div class="settings-item-text">
            <div class="settings-item-label">JSONインポート</div>
            <div class="settings-item-desc">JSONファイルからデータを復元</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
      <div class="settings-section">
        <div class="settings-title">危険な操作</div>
        <div class="settings-item" onclick="deleteAll()" style="cursor:pointer;">
          <span class="settings-item-icon">🗑️</span>
          <div class="settings-item-text">
            <div class="settings-item-label" style="color:var(--red)">全データ削除</div>
            <div class="settings-item-desc">すべてのシリーズ・本を削除します</div>
          </div>
          <span class="settings-item-arrow" style="color:var(--red)">›</span>
        </div>
      </div>
      <div style="text-align:center;padding:16px 0;font-size:12px;color:var(--br4);">
        シリーズ本棚 α版
      </div>
    </div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="nav">
    <button class="nav-btn active" id="navHome" onclick="goHome()">
      <span class="nav-icon">🏠</span>ホーム
    </button>
    <button class="nav-btn" id="navSettings" onclick="goSettings()">
      <span class="nav-icon">⚙️</span>設定
    </button>
  </nav>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="onFabClick()" title="追加">＋</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
let db = {series:[]};

function saveDB(){localStorage.setItem('bookSeriesDB',JSON.stringify(db));}
function loadDB(){
  try{const s=localStorage.getItem('bookSeriesDB');if(s)db=JSON.parse(s);}catch(e){}
  // migrate: ensure arrays
  db.series=db.series||[];
  db.series.forEach(s=>{
    s.groups=s.groups||[];
    s.memo=s.memo||'';
    s.groups.forEach(g=>{
      g.books=g.books||[];
      g.memo=g.memo||'';
      g.books.forEach(b=>{b.memo=b.memo||'';});
    });
    // ungrouped books at series level (legacy)
    s.books=s.books||[];
  });
}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ===== STATE =====
let currentPage='home';
let currentSeriesId=null;

// ===== COMPUTED =====
function seriesStats(s){
  let total=0,owned=0;
  const allGroups=[...s.groups];
  // default group for ungrouped books
  if(s.books&&s.books.length>0) allGroups.unshift({books:s.books,id:'__default',name:''});
  allGroups.forEach(g=>{
    g.books.forEach(b=>{total++;if(b.owned)owned++;});
  });
  return{total,owned,missing:total-owned};
}

function nextBuy(s){
  // first unowned book across groups (by group order, then book order)
  const allGroups=[];
  if(s.books&&s.books.length>0) allGroups.push({books:s.books,name:''});
  s.groups.forEach(g=>allGroups.push(g));
  for(const g of allGroups){
    const sorted=[...g.books].sort(sortBooks);
    for(const b of sorted){if(!b.owned)return b;}
  }
  return null;
}

function missingBooks(s){
  const result=[];
  const allGroups=[];
  if(s.books&&s.books.length>0) allGroups.push({books:s.books,name:''});
  s.groups.forEach(g=>allGroups.push(g));
  allGroups.forEach(g=>{
    const sorted=[...g.books].sort(sortBooks);
    sorted.filter(b=>!b.owned).forEach(b=>result.push({book:b,groupName:g.name}));
  });
  return result;
}

function quickAddBook(sid,gid){
  const numEl=document.getElementById('newNum_'+gid);

  const title=titleEl.value.trim();

  let books;
  if(gid==='__default'){books=s.books=s.books||[];}

// ===== MODAL =====
let modalStack=[];
function openModal(html){
  const ov=document.createElement('div');
  ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-backdrop"></div><div class="modal">${html}</div>`;
  ov.querySelector('.modal-backdrop').onclick=()=>closeModal(ov);
  document.body.appendChild(ov);
  modalStack.push(ov);
  return ov;
}
function closeModal(ov){
  if(ov){ov.remove();modalStack=modalStack.filter(x=>x!==ov);}
  else if(modalStack.length){modalStack.pop().remove();}
}

// 保存関数
function saveNewBook(sid){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  const gid = document.getElementById('ab_group').value;
  const title = document.getElementById('ab_title').value.trim();
  const displayNum = document.getElementById('ab_num').value.trim();
  const orderInput = document.getElementById('ab_order').value.trim();
  const owned = document.getElementById('ab_owned').value === '1';
  const memo = document.getElementById('ab_memo').value;

  if(!title){
    alert('タイトルを入力してください');
    return;
  }

  let books;

  if(gid === '__default'){
    s.books = s.books || [];
    books = s.books;
  }else{
    const g = s.groups.find(x => x.id === gid);
    if(!g) return;
    g.books = g.books || [];
    books = g.books;
  }

  const maxOrder = books.length
    ? Math.max(...books.map(b => b.order || 0))
    : 0;

  books.push({
    id: genId(),
    title,
    displayNum,
    owned,
    memo,
    order: orderInput ? parseFloat(orderInput) || maxOrder + 1 : maxOrder + 1
  });

  saveDB();
  closeModal();
  renderDetail();
  showToast('本を追加しました');
}

      <button class="btn btn-primary" onclick="updateBook('${sid}','${gid}','${bid}')">保存</button>
    </div>
  `);
}
function updateBook(sid,gid,bid){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  const oldBooks =
    gid === '__default'
      ? s.books
      : s.groups.find(g => g.id === gid)?.books;

  const b = oldBooks?.find(x => x.id === bid);
  if(!b) return;

  const newGid = document.getElementById('eb_group').value;
  const title = document.getElementById('eb_title').value.trim();

  if(!title){
    alert('タイトルは必須です');
    return;
  }

  b.title = title;
  b.displayNum = document.getElementById('eb_num').value.trim();
  b.order = parseFloat(document.getElementById('eb_order').value) || 0;
  b.owned = document.getElementById('eb_owned').value === '1';
  b.memo = document.getElementById('eb_memo').value;

  if(newGid !== gid){
    let newBooks;

    if(newGid === '__default'){
      s.books = s.books || [];
      newBooks = s.books;
    }else{
      const newGroup = s.groups.find(g => g.id === newGid);
      if(!newGroup) return;
      newGroup.books = newGroup.books || [];
      newBooks = newGroup.books;
    }

    const oldIndex = oldBooks.findIndex(x => x.id === bid);
    if(oldIndex >= 0){
      oldBooks.splice(oldIndex, 1);
    }

    newBooks.push(b);
  }

  saveDB();
  closeModal();
  renderDetail();
  showToast('保存しました');
}
function deleteBook(sid,gid,bid){
  const s=db.series.find(x=>x.id===sid);
  const isDefault=gid==='__default';
  const books=isDefault?s?.books:s?.groups.find(g=>g.id===gid)?.books;
  const b=books?.find(x=>x.id===bid);if(!b)return;
  confirm2('本を削除',`「${b.title}」を削除しますか？`,()=>{
    if(isDefault)s.books=s.books.filter(x=>x.id!==bid);
    else{const g=s.groups.find(x=>x.id===gid);if(g)g.books=g.books.filter(x=>x.id!==bid);}
    saveDB();closeModal();renderDetail();showToast('削除しました');
  });
}


// order -> 表示番号 -> タイトルでソート
function getSortText(b){
  return String(b.displayNum || b.title || '');
}

function sortBooks(a,b){
  const ao = Number(a.order || 0);
  const bo = Number(b.order || 0);

  if(ao || bo){
    return ao - bo;
  }

  return getSortText(a).localeCompare(
    getSortText(b),
    'ja',
    {numeric:true, sensitivity:'base'}
  );
}

// ===== BOOK MEMO BUBBLE =====
function showBookMemo(e,sid,gid,bid){
  e.stopPropagation();

  const books=gid==='__default'?s?.books:s?.groups.find(g=>g.id===gid)?.books;

    <div class="bubble-title">${esc(b.title)}</div>
    ${b.displayNum?`<div class="bubble-num">${esc(b.displayNum)}</div>`:''}
    ${b.memo?`<div class="bubble-memo">${esc(b.memo)}</div>`:`<div class="bubble-no-memo">メモなし</div>`}
  </div>`;

// ===== CONFIRM =====
function confirm2(title,msg,onOk,okLabel){
  const ov=document.createElement('div');
  ov.className='confirm-overlay';
  ov.innerHTML=`<div class="confirm-backdrop"></div>
  <div class="confirm-box">
    <div class="confirm-title">${esc(title)}</div>
    <div class="confirm-msg">${esc(msg)}</div>
    <div class="confirm-btns">
      <button class="btn btn-ghost" id="cCancel">キャンセル</button>
      <button class="btn btn-danger" id="cOk">${okLabel||'削除'}</button>
    </div>
  </div>`;
  ov.querySelector('.confirm-backdrop').onclick=()=>ov.remove();

  ov.querySelector('#cOk').onclick=()=>{ov.remove();onOk();};
  document.body.appendChild(ov);
}

// ===== TOAST =====
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`book-series-${new Date().toISOString().slice(0,10)}.json`;

function importData(){

}
document.getElementById('importFile').addEventListener('change',function(){
  const file=this.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.series)throw new Error('invalid');
      confirm2('インポート確認','現在のデータをすべて置き換えます。よいですか？',()=>{
        db=data;saveDB();goHome();showToast('インポートしました');
      },'置き換え');
    }catch{alert('JSONファイルの形式が正しくありません');}
  };
  reader.readAsText(file);
  this.value='';
});

// シリーズ名に対応するサンプルを返す。一致しない場合は汎用サンプルを返す
function _getSampleCandidates(seriesName){
  // 完全一致
  if(SAMPLE_CANDIDATES_BY_SERIES[seriesName]) return SAMPLE_CANDIDATES_BY_SERIES[seriesName];
  // 部分一致（シリーズ名にキーワードが含まれる）
  for(const key of Object.keys(SAMPLE_CANDIDATES_BY_SERIES)){
    if(seriesName.includes(key) || key.includes(seriesName)){
      return SAMPLE_CANDIDATES_BY_SERIES[key];
    }
  }
  // 一致なし → 汎用サンプル（シリーズ名を埋め込み、3パターンを明示）
  return [
    {title:seriesName + ' 第1巻（サンプル）', displayNum:'1巻', publisher:'（サンプル出版社）', label:'（サンプルレーベル）', publishedDate:'2020-01-01', confidence:'high',   reason:'シリーズ名・出版社・レーベルが一致'},
    {title:seriesName + ' 第2巻（サンプル）', displayNum:'2巻', publisher:'（サンプル出版社）', label:'',                    publishedDate:'2020-06-01', confidence:'medium', reason:'出版社は一致、レーベル未取得'},
    {title:seriesName + ' 第3巻（サンプル）', displayNum:'3巻', publisher:'',                   label:'',                    publishedDate:'2021-01-01', confidence:'low',    reason:'タイトルはヒットしたが、出版社またはレーベルが検索条件と不一致'},
  ];
}

let bulkCandidates = [];
let bulkChecked = new Set();

function openBulkCandidateModal(sid, candidates){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  const isSample = !candidates;
  bulkCandidates = (candidates || _getSampleCandidates(s.name)).slice().sort((a,b)=>{
    return (a.publishedDate||'').localeCompare(b.publishedDate||'');
  });

  const existingTitles = new Set();
  (s.books || []).forEach(b => existingTitles.add(b.title.trim()));
  s.groups.forEach(g => (g.books || []).forEach(b => existingTitles.add(b.title.trim())));

  bulkChecked = new Set();
  bulkCandidates.forEach((c, i) => {
    const dup = existingTitles.has(c.title.trim());
    if(!dup && (c.confidence === 'high' || c.confidence === 'medium')){
      bulkChecked.add(i);
    }
  });

  const groupOptions = [
    '<option value="__default">グループなし</option>',
    ...s.groups.map(g => '<option value="' + g.id + '">' + esc(g.name) + '</option>')
  ].join('');

  // _buildBulkModalHTML は DOM 要素を返す
  const bulkDOM = _buildBulkModalHTML(sid, groupOptions, isSample);
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.onclick = () => closeModal(ov);
  const modalEl = document.createElement('div');
  modalEl.className = 'modal bulk-modal';
  modalEl.appendChild(bulkDOM);
  ov.appendChild(backdrop);
  ov.appendChild(modalEl);
  document.body.appendChild(ov);
  modalStack.push(ov);
  _renderBulkList(existingTitles);
}

function _buildBulkModalHTML(sid, groupOptions, isSample){
  // sid をdata属性に持たせてonclick内のクォート問題を回避
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="modal-head">
      <span class="modal-title">📋 候補から一括追加</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    ${isSample ? `<div style="background:#fff3cd;color:#7a5800;font-size:12px;padding:6px 14px;border-radius:8px;margin-bottom:10px;">⚠️ サンプルデータを表示しています。API連携後は実データに切り替わります。</div>` : ''}
    <div class="modal-body">
      <div class="bulk-target-bar">
        <span class="bulk-target-label">追加先：</span>
        <select id="bulk_group" onchange="_refreshBulkSelCount()">${groupOptions}</select>
      </div>
      <div class="bulk-sel-bar">
        <span class="bulk-sel-count" id="bulkSelCount"></span>
        <button class="btn btn-ghost btn-sm" onclick="_bulkSelectAll()">全選択</button>
        <button class="btn btn-ghost btn-sm" onclick="_bulkSelectNone()">全解除</button>
      </div>
      <div class="bulk-cand-list" id="bulkCandList"></div>
    </div>
    <div class="bulk-foot">
      <span class="bulk-added-count" id="bulkAddedMsg"></span>
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" id="bulkAddBtn">まとめて追加</button>
    </div>
  `;
  // bulkAddBtn に sid をdata属性で渡してイベント登録
  el.querySelector('#bulkAddBtn').addEventListener('click', function(){ _executeBulkAdd(sid); });
  return el;
}

function _renderBulkList(existingTitles){
  if(!existingTitles){
    const s = db.series.find(x => x.id === currentSeriesId);
    existingTitles = new Set();
    if(s){
      (s.books || []).forEach(b => existingTitles.add(b.title.trim()));
      s.groups.forEach(g => (g.books || []).forEach(b => existingTitles.add(b.title.trim())));
    }
  }
  const el = document.getElementById('bulkCandList');
  if(!el) return;

  if(bulkCandidates.length === 0){
    el.innerHTML = '<div class="bulk-empty">候補データがありません</div>';
    _refreshBulkSelCount();
    return;
  }

  const confLabel = {high:'精度：高', medium:'精度：中', low:'精度：低'};
  el.innerHTML = bulkCandidates.map((c, i) => {
    const dup = existingTitles.has(c.title.trim());
    const checked = bulkChecked.has(i);
    const conf = c.confidence || 'medium';
    const metaParts = [
      c.publisher ? esc(c.publisher) : '',
      c.label ? esc(c.label) : '',
      c.publishedDate ? esc(c.publishedDate) : '',
    ].filter(Boolean);
    const meta = metaParts.join(' ／ ');
    return '<div class="cand-item conf-' + esc(conf) + (dup ? ' is-dup' : '') + '" onclick="_toggleBulkCheck(' + i + ')" id="cand_' + i + '">'
      + '<div class="cand-cb' + (checked ? ' checked' : '') + '" id="candCb_' + i + '">' + (checked ? '✓' : '') + '</div>'
      + '<div class="cand-body">'
      + (c.displayNum ? '<div class="cand-num">' + esc(c.displayNum) + '</div>' : '')
      + '<div class="cand-title">' + esc(c.title) + (dup ? '<span class="cand-dup-badge">登録済み</span>' : '') + '</div>'
      + (meta ? '<div class="cand-meta">' + meta + '</div>' : '')
      + (c.reason ? '<div class="cand-reason">🔍 ' + esc(c.reason) + '</div>' : '')
      + '</div>'
      + '<span class="cand-conf">' + esc(confLabel[conf] || conf) + '</span>'
      + '</div>';
  }).join('');
  _refreshBulkSelCount();
}

function _toggleBulkCheck(i){
  if(bulkChecked.has(i)) bulkChecked.delete(i);
  else bulkChecked.add(i);
  const cb = document.getElementById('candCb_' + i);
  if(cb){
    const checked = bulkChecked.has(i);
    cb.className = 'cand-cb' + (checked ? ' checked' : '');
    cb.textContent = checked ? '✓' : '';
  }
  _refreshBulkSelCount();
}

function _bulkSelectAll(){
  bulkCandidates.forEach((_, i) => bulkChecked.add(i));
  _renderBulkList();
}
function _bulkSelectNone(){
  bulkChecked.clear();
  _renderBulkList();
}

function _refreshBulkSelCount(){
  const el = document.getElementById('bulkSelCount');
  if(el) el.textContent = bulkChecked.size + ' 件を選択中';
  const btn = document.getElementById('bulkAddBtn');
  if(btn) btn.disabled = bulkChecked.size === 0;
}

function _executeBulkAdd(sid){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;
  const gid = document.getElementById('bulk_group')?.value || '__default';
  let books;
  if(gid === '__default'){
    s.books = s.books || [];
    books = s.books;
  } else {
    const g = s.groups.find(x => x.id === gid);
    if(!g) return;
    g.books = g.books || [];
    books = g.books;
  }
  const toAdd = [...bulkChecked].sort((a,b) => a - b).map(i => bulkCandidates[i]);
  toAdd.forEach(c => {
    books.push({id: genId(), title: c.title, displayNum: c.displayNum || '', owned: false, memo: '', order: 0});
  });
  saveDB();
  const msg = document.getElementById('bulkAddedMsg');
  if(msg){ msg.textContent = '✅ ' + toAdd.length + '冊を追加しました'; msg.style.color = 'var(--owned)'; }
  bulkChecked.clear();
  _renderBulkList();
  setTimeout(()=>{ closeModal(); renderDetail(); showToast(toAdd.length + '冊を追加しました'); }, 800);
}

// ===== UTIL =====
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ===== INIT =====
loadDB();
renderHome();
