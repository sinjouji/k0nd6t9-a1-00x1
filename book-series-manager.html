<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>シリーズ本棚</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg:        #f5efe6;
  --bg2:       #ede4d6;
  --card:      #fffdf9;
  --br1:       #3d2b1f;
  --br2:       #5c3d2e;
  --br3:       #8b6347;
  --br4:       #c8a97e;
  --br5:       #e8d8c4;
  --owned:     #4a7c59;
  --owned-bg:  #e8f4e8;
  --miss:      #a05c00;
  --miss-bg:   #fff3cd;
  --red:       #c0392b;
  --radius:    12px;
  --radius-sm: 8px;
  --shadow:    0 2px 8px rgba(61,43,31,.12);
  --shadow-lg: 0 8px 32px rgba(61,43,31,.18);
  --header-h:  56px;
  --bottom-nav:72px;
  --safe-b:    env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--br2);font-family:-apple-system,'Hiragino Sans','YuGothic',sans-serif;font-size:15px;line-height:1.6; touch-action: pan-y; overflow-x:hidden;}


/* ===== LAYOUT ===== */
#app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;position:relative;}
.header{height:var(--header-h);background:var(--br1);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100;}
.header h1{font-size:17px;font-weight:700;flex:1;letter-spacing:.02em;}
.header-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.9;border-radius:6px;}
.header-btn:active{opacity:.6;}
.main{flex:1;overflow-y:auto;padding:12px 12px calc(var(--bottom-nav) + var(--safe-b) + 12px);-webkit-overflow-scrolling:touch;}
.nav{height:var(--bottom-nav);padding-bottom:var(--safe-b);background:var(--br1);display:flex;border-top:1px solid rgba(255,255,255,.1);position:sticky;bottom:0;z-index:100;min-height:72px;height:calc(72px + var(--safe-b));}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;color:rgba(255,255,255,.6);font-size:10px;gap:3px;cursor:pointer;transition:color .15s;padding-top:6px;padding-bottom:6px;}
.nav-btn.active{color:#fff;}
.nav-icon{font-size:20px;line-height:1;}

/* ===== PAGES ===== */
.page{display:none;}.page.active{display:block;}

/* miss */
.miss-icon-btn{
  border:none;
  background:rgba(255,180,0,.18);
  color:#ffe090;
  border-radius:20px;
  padding:2px 8px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.miss-icon-btn:active{
  opacity:.7;
}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
.card-body{padding:14px 16px;}
.card-tap{cursor:pointer;}
.card-tap:active{opacity:.75;}

/* ===== HOME ===== */
.series-card{cursor:pointer;}
.series-card:active{opacity:.8;}
.series-card .card-body{padding:14px 16px 12px;}
.series-name{font-size:16px;font-weight:700;color:var(--br1);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.series-stats{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--br3);margin-bottom:8px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;gap:3px;}
.badge-owned{background:var(--owned-bg);color:var(--owned);}
.badge-miss{background:var(--miss-bg);color:var(--miss);}
.badge-total{background:var(--bg2);color:var(--br3);}
/* 背表紙バー（シグネチャ要素） */
.spine-bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-bottom:8px;}
.spine-bar-fill{height:100%;background:linear-gradient(90deg,var(--br3),var(--br4));border-radius:4px;transition:width .4s ease;}
.next-buy{font-size:13px;color:var(--br2);display:flex;align-items:flex-start;gap:6px;}
.next-buy-label{color:var(--br4);font-weight:600;flex-shrink:0;}
.next-buy-title{color:var(--br2);}
.memo-icon-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px;line-height:1;opacity:.65;flex-shrink:0;}
.memo-icon-btn:active{opacity:.4;}
.empty-state{text-align:center;padding:48px 24px;color:var(--br3);}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty-state p{font-size:14px;line-height:1.7;}

/* ===== FAB ===== */
.fab{position:fixed;bottom:calc(var(--bottom-nav) + var(--safe-b) + 16px);right:calc(50% - 270px + 16px);background:var(--br1);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:26px;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;z-index:50;transition:transform .15s;}
.fab:active{transform:scale(.93);}
@media(max-width:540px){.fab{right:16px;}}

/* ===== SERIES DETAIL ===== */
.detail-hero{background:var(--br1);color:#fff;padding:16px 16px 12px;}
.detail-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.detail-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.detail-next{font-size:13px;color:rgba(255,255,255,.75);display:flex;gap:6px;flex-wrap:wrap;}
.detail-next-label{color:var(--br4);font-weight:600;}
.detail-memo{font-size:13px;color:rgba(255,255,255,.8);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);white-space:pre-wrap;}
.detail-memo-toggle{background:none;border:none;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;padding:0;margin-top:6px;display:flex;align-items:center;gap:4px;}
.detail-memo-toggle:active{opacity:.6;}

.group-section{margin-bottom:12px;}
.group-header{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;}
.group-name{font-size:14px;font-weight:700;color:var(--br2);flex:1;}
.group-stats{font-size:12px;color:var(--br3);}
.group-memo-text{font-size:12px;color:var(--br3);padding:4px 16px 8px;background:var(--bg2);white-space:pre-wrap;}
.group-memo-toggle{background:none;border:none;color:var(--br4);font-size:12px;cursor:pointer;padding:0;}
.group-next{
  font-size:12px;
  color:var(--br3);
  margin-top:2px;
  line-height:1.4;
}

.group-next.complete{
  color:var(--owned);
}


.book-list{background:var(--card);border-radius:0 0 var(--radius) var(--radius);overflow:hidden;}
.book-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bg2);cursor:pointer;transition:background .1s;}
.book-item:last-child{border-bottom:none;}
.book-item:active{background:var(--bg2);}
.book-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--br4);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:.15s;}
.book-check.owned{background:var(--owned);border-color:var(--owned);color:#fff;}
.book-num{font-size:12px;color:var(--br3);min-width:40px;flex-shrink:0;}
.book-title{font-size:14px;color:var(--br2);flex:1;}
.book-memo-icon{font-size:14px;opacity:.5;flex-shrink:0;}
.miss-list{padding:12px 16px;background:var(--miss-bg);border-radius:var(--radius);margin-bottom:12px;}
.miss-list-title{font-size:13px;font-weight:700;color:var(--miss);margin-bottom:6px;}
.miss-list-items{font-size:13px;color:var(--miss);line-height:1.8;}

/* ===== BOOK BUBBLE ===== */
.bubble-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;background:transparent;}
.bubble-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3);}
.bubble{position:relative;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:540px;margin:0 auto;box-shadow:var(--shadow-lg);z-index:1;animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.bubble-title{font-size:15px;font-weight:700;color:var(--br1);margin-bottom:4px;}
.bubble-num{font-size:13px;color:var(--br3);margin-bottom:8px;}
.bubble-memo{font-size:14px;color:var(--br2);white-space:pre-wrap;line-height:1.7;}
.bubble-no-memo{font-size:14px;color:var(--br4);font-style:italic;}

/* ===== BOTTOM SHEET (メモ用) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);}
.sheet{position:relative;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:540px;margin:0 auto;box-shadow:var(--shadow-lg);z-index:1;animation:slideUp .22s ease;max-height:60vh;overflow-y:auto;}
.sheet-title{font-size:15px;font-weight:700;color:var(--br1);margin-bottom:12px;}
.sheet-memo{font-size:14px;color:var(--br2);white-space:pre-wrap;line-height:1.8;}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;overscroll-behavior:contain;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);}
.modal{position:relative;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:540px;margin:0 auto;box-shadow:var(--shadow-lg);z-index:1;animation:slideUp .22s ease;max-height:85vh;display:flex;flex-direction:column; min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;}
.modal-head{display:flex;align-items:center;margin-bottom:16px;}
.modal-title{font-size:16px;font-weight:700;color:var(--br1);flex:1;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--br3);padding:2px;line-height:1;}
.modal-close:active{opacity:.6;}
.modal-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.modal-foot{margin-top:16px;display:flex;gap:10px;justify-content:flex-end;}

/* ===== FORM ===== */
.form-group{margin-bottom:14px;}
label{display:block;font-size:13px;color:var(--br3);font-weight:600;margin-bottom:5px;}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--br5);border-radius:var(--radius-sm);padding:9px 12px;font-size:15px;color:var(--br1);background:#fff;outline:none;font-family:inherit;}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--br3);}
textarea{resize:vertical;min-height:72px;}
.btn{padding:9px 20px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
.btn:active{opacity:.75;}
.btn-primary{background:var(--br1);color:#fff;}
.btn-ghost{background:transparent;color:var(--br3);border:1.5px solid var(--br5);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:6px 14px;font-size:13px;}
.btn-icon{background:none;border:none;cursor:pointer;font-size:18px;padding:4px;line-height:1;color:var(--br3);}
.btn-icon:active{opacity:.6;}

/* ===== DIVIDER ===== */
.divider{height:1px;background:var(--bg2);margin:12px 0;}

/* ===== SETTINGS ===== */
.settings-section{margin-bottom:20px;}
.settings-title{font-size:13px;font-weight:700;color:var(--br3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding:0 4px;}
.settings-item{background:var(--card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:6px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow);}
.settings-item:active{opacity:.75;}
.settings-item-icon{font-size:20px;width:28px;text-align:center;}
.settings-item-text{flex:1;}
.settings-item-label{font-size:15px;font-weight:600;color:var(--br2);}
.settings-item-desc{font-size:12px;color:var(--br3);margin-top:2px;}
.settings-item-arrow{color:var(--br4);font-size:16px;}
/* ===== GEMINI設定 ===== */
.api-key-wrap{display:flex;gap:8px;align-items:center;}
.api-key-input{flex:1;border:1.5px solid var(--br5);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;color:var(--br1);background:#fff;outline:none;font-family:monospace;}
.api-key-input:focus{border-color:var(--br3);}
.mode-toggle{display:flex;background:var(--bg2);border-radius:var(--radius-sm);padding:3px;gap:3px;}
.mode-btn{flex:1;padding:8px 0;border:none;border-radius:6px;font-size:13px;font-weight:600;color:var(--br3);background:transparent;cursor:pointer;}
.mode-btn.active{background:var(--br1);color:#fff;}
.usage-bar-wrap{margin:6px 0 2px;}
.usage-bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;}
.usage-bar-fill{height:100%;border-radius:3px;background:var(--owned);transition:width .3s;}
.usage-bar-fill.warn{background:var(--miss);}
.usage-bar-fill.over{background:var(--red);}
.usage-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--br3);margin-top:3px;}
.gemini-status{font-size:12px;padding:6px 10px;border-radius:6px;margin-top:6px;}
.gemini-status.ok{background:var(--owned-bg);color:var(--owned);}
.gemini-status.warn{background:var(--miss-bg);color:var(--miss);}
.gemini-status.err{background:#fde8e8;color:var(--red);}
.ai-generating{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--br3);padding:8px 0;}
.ai-generating-dot{width:8px;height:8px;border-radius:50%;background:var(--br4);animation:pulse .9s infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

/* ===== CONFIRM ===== */
.confirm-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.confirm-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);}
.confirm-box{position:relative;background:var(--card);border-radius:var(--radius);padding:24px 20px;width:100%;max-width:320px;box-shadow:var(--shadow-lg);z-index:1;}
.confirm-title{font-size:16px;font-weight:700;color:var(--br1);margin-bottom:8px;}
.confirm-msg{font-size:14px;color:var(--br3);margin-bottom:20px;line-height:1.6;}
.confirm-btns{display:flex;gap:10px;justify-content:flex-end;}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:calc(var(--bottom-nav) + var(--safe-b) + 16px);left:50%;transform:translateX(-50%);background:var(--br1);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:500;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* ===== ADD BOOK INLINE ===== */
.add-book-row{display:flex;gap:8px;padding:10px 12px;background:var(--bg2);border-radius:0/* 0 var(--radius) var(--radius)*/;}
.add-book-row input{flex:1;min-width:0;}
.add-book-row input:first-child{max-width:72px;}

/* ===== DRAG HANDLE (sort indicator) ===== */
.drag-hint{color:var(--br5);font-size:16px;flex-shrink:0;cursor:grab;}

/* ===== DETAIL ACTION BAR ===== */
.action-bar{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--bg2);}
.action-bar::-webkit-scrollbar{display:none;}
.action-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;border:1.5px solid var(--br5);background:var(--card);color:var(--br2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.action-chip:active{background:var(--bg2);}
.action-chip.active{background:var(--br1);color:#fff;border-color:var(--br1);}

/* ===== BULK CANDIDATE MODAL ===== */
.bulk-modal{max-height:90vh;}
.bulk-modal > div{
  display:flex;
  flex-direction:column;
  min-height:0;
  max-height:85vh;
}
.bulk-modal .modal-body{
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.bulk-target-bar{background:var(--bg2);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.bulk-target-label{font-size:13px;color:var(--br3);font-weight:600;flex-shrink:0;}
.bulk-target-bar select{flex:1;min-width:140px;padding:6px 10px;font-size:14px;}
.bulk-sel-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.bulk-sel-count{font-size:13px;color:var(--br3);flex:1;}
.bulk-cand-list{display:flex;flex-direction:column;gap:6px;}
.cand-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid transparent;cursor:pointer;transition:background .1s;position:relative;}
.cand-item:active{opacity:.8;}
.cand-item.conf-high{background:#f0faf3;border-color:#b2dfc1;}
.cand-item.conf-medium{background:#fffbea;border-color:#f0d98a;}
.cand-item.conf-low{background:#fff2f0;border-color:#f5bcb4;}
.cand-item.is-dup{opacity:.6;}
.cand-item.is-dup .cand-title{text-decoration:line-through;}
.cand-cb{width:20px;height:20px;border-radius:4px;border:2px solid var(--br4);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px;background:#fff;}
.cand-cb.checked{background:var(--br1);border-color:var(--br1);color:#fff;}
.cand-body{flex:1;min-width:0;}
.cand-num{font-size:12px;color:var(--br3);margin-bottom:1px;}
.cand-title{font-size:14px;font-weight:600;color:var(--br1);word-break:break-all;}
.cand-meta{font-size:11px;color:var(--br3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
.cand-reason{font-size:10px;color:var(--br3);margin-top:2px;font-style:italic;line-height:1.4;}
.cand-conf{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;flex-shrink:0;align-self:flex-start;margin-top:3px;}
.conf-high .cand-conf{background:#b2dfc1;color:#1a5c35;}
.conf-medium .cand-conf{background:#f0d98a;color:#6b4c00;}
.conf-low .cand-conf{background:#f5bcb4;color:#7a1a10;}
.cand-dup-badge{font-size:10px;background:var(--bg2);color:var(--br3);padding:1px 6px;border-radius:10px;margin-left:4px;}
.cand-check-badge{font-size:10px;background:#fde8e8;color:var(--red);padding:1px 6px;border-radius:10px;margin-left:4px;font-weight:700;}
.cand-source{font-size:10px;color:var(--br4);margin-top:2px;word-break:break-all;}
.bulk-empty{text-align:center;padding:32px 0;color:var(--br3);font-size:14px;}
.bulk-foot{margin-top:14px;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.bulk-added-count{font-size:13px;color:var(--br3);flex:1;}
/* JSON入力パネル */
.bulk-json-panel{background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;}
.bulk-json-label{font-size:12px;font-weight:700;color:var(--br3);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bulk-json-textarea{width:100%;min-height:88px;max-height:160px;border:1.5px solid var(--br5);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;font-family:monospace;color:var(--br2);background:#fff;resize:vertical;outline:none;}
.bulk-json-textarea:focus{border-color:var(--br3);}
.bulk-json-textarea.error{border-color:var(--red);}
.bulk-json-err{font-size:11px;color:var(--red);margin-top:4px;min-height:14px;}
.bulk-json-actions{display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap;}
.bulk-json-hint{font-size:11px;color:var(--br4);flex:1;}
/* AI設定パネル */
.ai-panel{display:none;background:#fdf8f0;border-left:3px solid var(--br4);padding:12px 14px;flex-direction:column;gap:10px;}
.ai-panel.open{display:flex;}
.ai-panel-title{font-size:12px;font-weight:700;color:var(--br3);letter-spacing:.04em;}
.ai-field{display:flex;flex-direction:column;gap:3px;}
.ai-field label{font-size:11px;color:var(--br3);font-weight:600;}
.ai-field input,.ai-field textarea{width:100%;border:1px solid var(--br5);border-radius:6px;padding:6px 9px;font-size:13px;color:var(--br1);background:#fff;outline:none;font-family:inherit;}
.ai-field input:focus,.ai-field textarea:focus{border-color:var(--br3);}
.ai-field textarea{resize:vertical;min-height:56px;}
.ai-field textarea.mono{font-size:12px;font-family:monospace;min-height:52px;}
.ai-field-row{display:flex;gap:6px;align-items:center;}
.ai-field-row .btn{flex-shrink:0;padding:5px 10px;font-size:11px;}
.ai-panel-actions{display:flex;gap:8px;margin-top:4px;align-items:center;flex-wrap:wrap;}
.ai-panel-actions .btn{padding:7px 16px;font-size:13px;}
.ai-save-ok{font-size:12px;color:var(--owned);opacity:0;transition:opacity .3s;}
.ai-save-ok.show{opacity:1;}
/* Prompt modal */
.prompt-modal .modal-body{display:flex;flex-direction:column;}
.prompt-textarea{width:100%;flex:1;min-height:260px;border:1.5px solid var(--br5);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-family:monospace;line-height:1.6;color:var(--br2);background:#fafaf8;resize:none;outline:none;}
.prompt-textarea:focus{border-color:var(--br3);}
.prompt-copy-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:var(--br1);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;letter-spacing:.02em;}
.prompt-copy-btn:active{opacity:.8;}
.prompt-copy-btn.copied{background:var(--owned);}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header class="header" id="header">
    <h1 id="headerTitle">📚 シリーズ本棚</h1>
    <button class="header-btn" id="headerActionBtn" style="display:none" title="編集"></button>
    <button class="header-btn" id="headerBackBtn" style="display:none" title="戻る">←</button>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <!-- HOME -->
    <div class="page active" id="pageHome">
      <div id="seriesList"></div>
    </div>
    <!-- DETAIL -->
    <div class="page" id="pageDetail">
      <div id="detailContent"></div>
    </div>
    <!-- SETTINGS -->
    <div class="page" id="pageSettings">
      <div class="settings-section">
        <div class="settings-title">データ管理</div>
        <div class="settings-item" onclick="exportData()">
          <span class="settings-item-icon">📤</span>
          <div class="settings-item-text">
            <div class="settings-item-label">JSONエクスポート</div>
            <div class="settings-item-desc">データをJSONファイルで保存</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </div>
        <div class="settings-item" onclick="importData()">
          <span class="settings-item-icon">📥</span>
          <div class="settings-item-text">
            <div class="settings-item-label">JSONインポート</div>
            <div class="settings-item-desc">JSONファイルからデータを復元</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
      <!-- Gemini API設定 -->
      <div class="settings-section" id="geminiSettingsSection">
        <div class="settings-title">🤖 Gemini API設定</div>
        <div class="card" style="padding:14px 16px;">
          <div style="margin-bottom:12px;">
            <label style="font-size:12px;font-weight:700;color:var(--br3);display:block;margin-bottom:6px;">動作モード</label>
            <div class="mode-toggle">
              <button class="mode-btn" id="modeManualBtn" onclick="setGeminiMode('manual')">✍️ 手動</button>
              <button class="mode-btn" id="modeAutoBtn"   onclick="setGeminiMode('auto')">⚡ 自動</button>
            </div>
            <div style="font-size:11px;color:var(--br3);margin-top:5px;" id="modeDesc"></div>
          </div>
          <div style="margin-bottom:12px;">
            <label style="font-size:12px;font-weight:700;color:var(--br3);display:block;margin-bottom:6px;">APIキー</label>
            <div class="api-key-wrap">
              <input class="api-key-input" type="password" id="geminiApiKeyInput" placeholder="AIza...">
              <button class="btn btn-ghost btn-sm" onclick="toggleApiKeyVisibility()">👁</button>
              <button class="btn btn-primary btn-sm" onclick="saveGeminiApiKey()">保存</button>
            </div>
            <div id="geminiApiKeyStatus" style="font-size:11px;color:var(--br3);margin-top:4px;"></div>
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
              <label style="font-size:12px;font-weight:700;color:var(--br3);flex:1;">使用回数（本日）</label>
              <button class="btn btn-ghost btn-sm" onclick="resetUsageCount()">リセット</button>
            </div>
            <div class="usage-bar-wrap">
              <div class="usage-bar"><div class="usage-bar-fill" id="usageBarFill" style="width:0%"></div></div>
            </div>
            <div class="usage-stats">
              <span id="usageCountLabel">0 回</span>
              <span>上限: <input type="number" id="usageLimitInput" min="1" max="999"
                style="width:46px;border:1px solid var(--br5);border-radius:4px;padding:1px 4px;font-size:12px;text-align:center;"
                onchange="saveUsageLimit()"> 回/日</span>
            </div>
            <div id="geminiUsageStatus" class="gemini-status" style="display:none;"></div>
            <div style="font-size:11px;color:var(--br3);margin-top:4px;" id="usageResetTimeLabel"></div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-title">危険な操作</div>
        <div class="settings-item" onclick="deleteAll()" style="cursor:pointer;">
          <span class="settings-item-icon">🗑️</span>
          <div class="settings-item-text">
            <div class="settings-item-label" style="color:var(--red)">全データ削除</div>
            <div class="settings-item-desc">すべてのシリーズ・本を削除します</div>
          </div>
          <span class="settings-item-arrow" style="color:var(--red)">›</span>
        </div>
      </div>
      <div style="text-align:center;padding:16px 0;font-size:12px;color:var(--br4);">
        シリーズ本棚 α版
      </div>
    </div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="nav">
    <button class="nav-btn active" id="navHome" onclick="goHome()">
      <span class="nav-icon">🏠</span>ホーム
    </button>
    <button class="nav-btn" id="navSettings" onclick="goSettings()">
      <span class="nav-icon">⚙️</span>設定
    </button>
  </nav>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="onFabClick()" title="追加">＋</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
let db = {series:[]};

function saveDB(){localStorage.setItem('bookSeriesDB',JSON.stringify(db));}
function loadDB(){
  try{const s=localStorage.getItem('bookSeriesDB');if(s)db=JSON.parse(s);}catch(e){}
  // migrate: ensure arrays
  db.series=db.series||[];
  db.series.forEach(s=>{
    s.groups=s.groups||[];
    s.memo=s.memo||'';
    s.groups.forEach(g=>{
      g.books=g.books||[];
      g.memo=g.memo||'';
      g.books.forEach(b=>{b.memo=b.memo||'';});
    });
    // ungrouped books at series level (legacy)
    s.books=s.books||[];
  });
}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ===== STATE =====
let currentPage='home';
let currentSeriesId=null;

// ===== COMPUTED =====
function seriesStats(s){
  let total=0,owned=0;
  const allGroups=[...s.groups];
  // default group for ungrouped books
  if(s.books&&s.books.length>0) allGroups.unshift({books:s.books,id:'__default',name:''});
  allGroups.forEach(g=>{
    g.books.forEach(b=>{total++;if(b.owned)owned++;});
  });
  return{total,owned,missing:total-owned};
}

function nextBuy(s){
  // first unowned book across groups (by group order, then book order)
  const allGroups=[];
  if(s.books&&s.books.length>0) allGroups.push({books:s.books,name:''});
  s.groups.forEach(g=>allGroups.push(g));
  for(const g of allGroups){
    const sorted=[...g.books].sort(sortBooks);
    for(const b of sorted){if(!b.owned)return b;}
  }
  return null;
}


function nextBuyInBooks(books){
  const sorted = [...(books || [])].sort(sortBooks);
  return sorted.find(b => !b.owned) || null;
}

function missingBooks(s){
  const result=[];
  const allGroups=[];
  if(s.books&&s.books.length>0) allGroups.push({books:s.books,name:''});
  s.groups.forEach(g=>allGroups.push(g));
  allGroups.forEach(g=>{
    const sorted=[...g.books].sort(sortBooks);
    sorted.filter(b=>!b.owned).forEach(b=>result.push({book:b,groupName:g.name}));
  });
  return result;
}

// ===== RENDER HOME =====
function renderHome(){
  const el=document.getElementById('seriesList');
  if(db.series.length===0){
    el.innerHTML=`<div class="empty-state"><div class="icon">📚</div><p>シリーズがまだありません。<br>「＋」ボタンで追加してください。</p></div>`;
    return;
  }
  el.innerHTML=db.series.map(s=>{
    const st=seriesStats(s);
    const pct=st.total>0?Math.round(st.owned/st.total*100):0;
    const nb=nextBuy(s);
    const memoBtn=s.memo?`<button class="memo-icon-btn" onclick="showMemo(event,'${s.id}')" title="メモ">💬</button>`:'';
    return `<div class="card series-card" onclick="openSeries('${s.id}')">
  <div class="card-body">
    <div class="series-name">
      ${esc(s.name)}${memoBtn}
    </div>
    <div class="spine-bar"><div class="spine-bar-fill" style="width:${pct}%"></div></div>
    <div class="series-stats">
      <span class="badge badge-owned">✓ ${st.owned}冊</span>
      ${st.missing>0?`<span class="badge badge-miss">未 ${st.missing}冊</span>`:''}
      <span class="badge badge-total">全${st.total}冊</span>
    </div>
    ${nb?`<div class="next-buy"><span class="next-buy-label">次▶</span><span class="next-buy-title">${esc(nb.displayNum?nb.displayNum+' ':'')}${esc(nb.title)}</span></div>`:''}
  </div>
</div>`;
  }).join('');
}

// ===== OPEN SERIES =====
function openSeries(id){
  currentSeriesId=id;
  currentPage='detail';
  showPage('detail');
  renderDetail();
}

function renderDetail(){
  const s=db.series.find(x=>x.id===currentSeriesId);
  if(!s)return goHome();
  const st=seriesStats(s);
  const nb=nextBuy(s);
  const miss=missingBooks(s);
  document.getElementById('headerTitle').textContent=s.name;
  document.getElementById('headerActionBtn').style.display='flex';
  document.getElementById('headerActionBtn').textContent='✏️';
  document.getElementById('headerActionBtn').onclick=()=>editSeries(s.id);
  document.getElementById('headerBackBtn').style.display='flex';

  const memoSection=s.memo?`
    <div id="detailMemoWrap">
      <button class="detail-memo-toggle" onclick="toggleDetailMemo()">
        <span id="detailMemoArrow">▾</span> メモを見る
      </button>
      <div class="detail-memo" id="detailMemoText" style="display:none">${esc(s.memo)}</div>
    </div>`:'';

  const allGroups=[];
  if(s.books&&s.books.length>0) allGroups.push({id:'__default',name:'',books:s.books,memo:''});
  s.groups.forEach(g=>allGroups.push(g));

  const groupsHTML=allGroups.map(g=>{
    const gst={total:g.books.length,owned:g.books.filter(b=>b.owned).length};
    const groupNext = nextBuyInBooks(g.books);
const groupNextHTML = groupNext
  ? `<div class="group-next">次▶ ${esc(groupNext.displayNum ? groupNext.displayNum + ' ' : '')}${esc(groupNext.title)}</div>`
  : `<div class="group-next complete">✨ コンプリート</div>`;
    const groupMemo=g.memo&&g.id!=='__default'?`
      <button class="group-memo-toggle" onclick="toggleGroupMemo('${g.id}')">💬 グループメモ</button>
      <div class="group-memo-text" id="gmemo_${g.id}" style="display:none">${esc(g.memo)}</div>`:'';
    const sorted=[...g.books].sort(sortBooks);
    const booksHTML=sorted.map(b=>`
      <div class="book-item">
        <div
  class="book-check ${b.owned?'owned':''}"
  onclick="toggleOwned(event,'${s.id}','${g.id}','${b.id}')"
>
  ${b.owned?'✓':''}
</div>
        <span class="book-num">${esc(b.displayNum||'')}</span>
        <span class="book-title">${esc(b.title)}</span>
        ${b.memo?`<span class="book-memo-icon" onclick="showBookMemo(event,'${s.id}','${g.id}','${b.id}')">💬</span>`:''}
        <button class="btn-icon" onclick="editBook(event,'${s.id}','${g.id}','${b.id}')" title="編集">…</button>
      </div>`).join('');
    const addBtnId='addBookBtn_'+g.id;
    const groupTitle = g.id === '__default'
  ? 'グループなし'
  : g.name;

const groupHeader = `
  <div class="group-header">
    <div style="flex:1;min-width:0;">
      <div class="group-name">${esc(groupTitle)}</div>
      ${groupNextHTML}
    </div>
    <span class="group-stats">${gst.owned}/${gst.total}冊</span>
    ${g.id !== '__default' ? `
      <button class="btn-icon" onclick="editGroup(event,'${s.id}','${g.id}')" title="グループ名・メモ編集">✏️</button>
      <button class="btn-icon" onclick="toggleAiPanel('${g.id}')" title="AI設定" style="font-size:15px;">⚙️</button>
    ` : ''}
  </div>
`;

const gai = g.ai || {};
const _defFmt = JSON.stringify({title:"",displayNum:"",publisher:"",label:"",publishedDate:"",confidence:"high",reason:"公式一覧ページ掲載"}, null, 2);
const _defFixed = _DEFAULT_FIXED_RULES;
const aiPanelHTML = g.id !== '__default' ? `
  <div class="ai-panel" id="aiPanel_${g.id}">
    <div class="ai-panel-title">⚙️ AI設定 — JSON依頼文</div>
    <div class="ai-field"><label>出版社</label>
      <input type="text" id="aip_publisher_${g.id}" value="${esc(gai.publisher||'')}" placeholder="例：KADOKAWA">
    </div>
    <div class="ai-field"><label>レーベル</label>
      <input type="text" id="aip_label_${g.id}" value="${esc(gai.label||'')}" placeholder="例：角川つばさ文庫">
    </div>
    <div class="ai-field"><label>参照URL（1行1件）</label>
      <textarea class="mono" id="aip_sourceUrls_${g.id}" placeholder="https://example.com/list">${esc((gai.sourceUrls||[]).join('\n'))}</textarea>
    </div>
    <div class="ai-field">
      <label>含めるもの（、・,／改行で区切って複数指定可）</label>
      <textarea id="aip_includeRules_${g.id}" placeholder="例：小説、文庫本">${esc(gai.includeRules||'')}</textarea>
    </div>
    <div class="ai-field">
      <label>除外するもの（、・,／改行で区切って複数指定可）</label>
      <textarea id="aip_excludeRules_${g.id}" placeholder="例：漫画版、絵本、スピンオフ">${esc(gai.excludeRules||'')}</textarea>
    </div>
    <div class="ai-field">
      <label>タイトル整形（コード側で確実に適用）</label>
      <div style="display:flex;gap:16px;margin:2px 0 6px;font-size:13px;flex-wrap:nowrap;">
        <label style="display:flex;align-items:center;gap:4px;font-weight:400;white-space:nowrap;flex-shrink:0;">
          <input type="radio" name="aip_titleMode_${g.id}" value="remove" ${(gai.titleRuleMode||'remove')==='remove'?'checked':''} style="flex-shrink:0;"> 除去
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400;white-space:nowrap;flex-shrink:0;">
          <input type="radio" name="aip_titleMode_${g.id}" value="add" ${gai.titleRuleMode==='add'?'checked':''} style="flex-shrink:0;"> 追加
        </label>
      </div>
      <input type="text" id="aip_titleWord_${g.id}" value="${esc(gai.titleRuleWord||'')}" placeholder="例：星のカービィ（単語のみ）">
      <div style="font-size:11px;color:var(--br3);margin-top:3px;">
        除去：タイトル先頭の「単語（＋半角スペース）」を取り除く／追加：「単語＋半角スペース」をタイトル先頭に付与
      </div>
    </div>
    <div class="ai-field">
      <div class="ai-field-row">
        <label style="flex:1;">固定ルール（編集可）</label>
        <button class="btn btn-ghost" onclick="resetFixedRules('${g.id}')">↩ 初期値</button>
      </div>
      <textarea class="mono" id="aip_fixedRules_${g.id}" style="min-height:140px;">${esc(gai.fixedRules||_defFixed)}</textarea>
    </div>
    <div class="ai-field"><label>追加ルール（1行1件）</label>
      <textarea id="aip_extraRules_${g.id}" placeholder="例：複数URLは全て参照&#10;重複作品は統合">${esc((gai.extraRules||[]).join('\n'))}</textarea>
    </div>
    <div class="ai-field">
      <div class="ai-field-row">
        <label style="flex:1;">出力形式（JSON）</label>
        <button class="btn btn-ghost" onclick="resetOutputFormat('${g.id}')">↩ 初期値</button>
      </div>
      <textarea class="mono" id="aip_outputFormat_${g.id}" style="min-height:120px;">${esc(gai.outputFormat||_defFmt)}</textarea>
    </div>
    <div class="ai-panel-actions">
      <button class="btn btn-ghost btn-sm" onclick="saveAiPanel('${s.id}','${g.id}')">✅ 保存</button>
      <button class="btn btn-primary btn-sm" id="genBtn_${g.id}" onclick="saveAiPanelAndGenerate('${s.id}','${g.id}')">${_geminiGetMode()==='auto'?'⚡ 自動取得':'🤖 JSON生成'}</button>
      <span class="ai-save-ok" id="aiSaveOk_${g.id}">保存しました</span>
    </div>
  </div>
` : '';

return `<div class="group-section">
  ${groupHeader}
  ${aiPanelHTML}
${groupMemo}
<div class="add-book-row">
  <input type="text" placeholder="No." id="newNum_${g.id}" style="max-width:72px">
  <input type="text" placeholder="タイトル" id="newTitle_${g.id}">
  <button class="btn btn-primary btn-sm" onclick="quickAddBook('${s.id}','${g.id}')">追加</button>
</div>
<div class="book-list" id="booklist_${g.id}">
  ${booksHTML}
</div>
</div>`;
  }).join('');

  // miss list
  const missHTML = '';

  document.getElementById('detailContent').innerHTML=`
    <div class="detail-hero">
      <div class="detail-title">${esc(s.name)}</div>
      <div class="detail-stats">
        <span class="badge badge-owned" style="background:rgba(255,255,255,.15);color:#fff">✓ ${st.owned}冊所持</span>
        ${st.missing>0?`<span class="badge badge-miss" style="background:rgba(255,180,0,.2);color:#ffe090">未 ${st.missing}冊</span>`:''}
        ${miss.length > 0
  ? `<button class="miss-icon-btn" onclick="showMissingList(event,'${s.id}')">📋 抜け巻</button>`
  : ''
}        
        <span class="badge badge-total" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)">全${st.total}冊</span>
      </div>
      ${nb?`<div class="detail-next"><span class="detail-next-label">次▶</span>${esc(nb.displayNum?nb.displayNum+' ':'')}${esc(nb.title)}</div>`:''}
      ${memoSection}
    </div>
    ${missHTML}
    <div style="padding:10px 12px 4px;display:flex;gap:8px;align-items:center;">
      <button class="btn btn-ghost btn-sm" onclick="addGroupModal('${s.id}')">＋ グループ追加</button>
      <button class="btn btn-ghost btn-sm" onclick="openBulkCandidateModal('${s.id}')" style="border-color:var(--br3);color:var(--br2);">📋 候補から追加</button>
    </div>
    ${groupsHTML}
    ${allGroups.length===0
  ? `<div style="padding:12px 16px;">
      <button class="btn btn-primary btn-sm" onclick="addBookModal('${s.id}')">本を追加</button>
    </div>`
  : ''}
  `;
}

// ===== TOGGLE MEMO =====
function toggleDetailMemo(){
  const el=document.getElementById('detailMemoText');
  const ar=document.getElementById('detailMemoArrow');
  if(el.style.display==='none'){el.style.display='block';ar.textContent='▴';}
  else{el.style.display='none';ar.textContent='▾';}
}
function toggleGroupMemo(gid){
  const el=document.getElementById('gmemo_'+gid);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

// ===== TOGGLE OWNED =====
function toggleOwned(e,sid,gid,bid){
  e.stopPropagation();

  const s=db.series.find(x=>x.id===sid);
  if(!s)return;

  const books=gid==='__default'
    ? s.books
    : s.groups.find(g=>g.id===gid)?.books;

  if(!books)return;

  const b=books.find(x=>x.id===bid);
  if(!b)return;

  b.owned=!b.owned;
  saveDB();
  renderDetail();
}

// ===== QUICK ADD BOOK =====
function quickAddBook(sid,gid){
  const numEl=document.getElementById('newNum_'+gid);
  const titleEl=document.getElementById('newTitle_'+gid);
  if(!numEl||!titleEl)return;
  const title=titleEl.value.trim();
  const displayNum=numEl.value.trim();
  if(!title)return;
  const s=db.series.find(x=>x.id===sid);
  if(!s)return;
  let books;
  if(gid==='__default'){books=s.books=s.books||[];}
  else{
    let g=s.groups.find(x=>x.id===gid);
    if(!g){
      // create default group
      g={id:genId(),name:'',books:[],memo:''};
      s.groups.push(g);
    }
    books=g.books;
  }
//  const maxOrder=books.length?Math.max(...books.map(b=>b.order||0)):0;
  books.push({id:genId(),title,displayNum,owned:false,memo:'',order:0});
  saveDB();
  numEl.value='';titleEl.value='';
  renderDetail();
  showToast(`「${title}」を追加`);
}

// ===== PAGES =====
function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('page'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');
  document.getElementById('navHome').classList.toggle('active',p==='home'||p==='detail');
  document.getElementById('navSettings').classList.toggle('active',p==='settings');

let modalStack=[];
function openModal(html){
  const ov=document.createElement('div');
  ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-backdrop"></div><div class="modal">${html}</div>`;
  ov.querySelector('.modal-backdrop').onclick=()=>closeModal(ov);
  document.body.appendChild(ov);
  modalStack.push(ov);
  return ov;
}
function closeModal(ov){
  if(ov){ov.remove();modalStack=modalStack.filter(x=>x!==ov);}
  else if(modalStack.length){modalStack.pop().remove();}
}

// タイトル整形をコード側で確実に適用（AIの指示遵守に依存しない）
// カンマ・読点・中黒・スラッシュなど複数の区切り文字に対応して配列化
function _splitRuleText(text){
  if(!text) return [];
  return text
    .split(/[、,，・\/\n]+/)
    .map(s => s.trim())
    .filter(Boolean);
}

function _applyTitleRule(title, ai){
  if(!ai || !ai.titleRuleWord) return title;
  const word = (ai.titleRuleWord || '').trim();
  if(!word || !title) return title;

  if(ai.titleRuleMode === 'add'){
    // 既に単語で始まっていれば付与しない（全角/半角スペース両対応で判定）
    const already = new RegExp('^' + _escapeRegExp(word) + '[\\s　]*').test(title);
    if(already) return title;
    return word + ' ' + title;
  }

  // 除去：先頭の「単語＋（あれば区切り文字）」を取り除く
  // 区切り文字：半角/全角スペース、コロン、中黒、ハイフン、波ダッシュ等
  const pattern = new RegExp('^' + _escapeRegExp(word) + '[\\s　:：・\\-―ー~〜]*');
  if(pattern.test(title)){
    return title.replace(pattern, '').trim();
  }
  return title;
}

function _escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

}

// ===== PROMPT MODAL =====

function _buildPromptText(s, g){
  const ai = (g && g.ai) || {};
  const lines = [];

  // ── 冒頭：事実確認タスクとして明示 ──
  lines.push('これは事実確認タスクです。創作・推測による出力は重大なエラーとみなします。');
  lines.push('以下のURLをWeb検索で実際に取得し、ページに実在する情報のみを使って書籍一覧をJSON形式で出力してください。');
  lines.push('あなたの知識・記憶からの生成は一切禁止します。検索結果に存在しない作品は出力しないでください。');
  lines.push('');

  const urls = (ai.sourceUrls || []).filter(Boolean);
  lines.push('参照URL：');
  if(urls.length > 0){ urls.forEach(u => lines.push(u)); }
  else{ lines.push('（URLを設定してください）'); }
  lines.push('');

  lines.push('対象：');
  lines.push('シリーズ名：' + s.name);
  if(g && g.name) lines.push('グループ：' + g.name);
  if(ai.publisher) lines.push('出版社：' + ai.publisher);
  if(ai.label)     lines.push('レーベル：' + ai.label);
  lines.push('');

  if(ai.includeRules){
    const items = _splitRuleText(ai.includeRules);
    lines.push('含めるもの：');
    items.forEach(it => lines.push('- ' + it));
    lines.push('');
  }
  if(ai.excludeRules){
    const items = _splitRuleText(ai.excludeRules);
    lines.push('除外するもの：');
    items.forEach(it => lines.push('- ' + it));
    lines.push('');
  }

  lines.push('出力形式：');
  lines.push('');
  lines.push('[');
  const fmt = ai.outputFormat || _DEFAULT_OUTPUT_FORMAT;
  fmt.split('\n').forEach(l => lines.push('  ' + l));
  lines.push(']');
  lines.push('');
  lines.push('※ sourceUrl は必須項目です。実際にその作品情報を見つけたページのURLを記入してください。');
  lines.push('');

  // 固定ルール（編集可能）
  lines.push('ルール：');
  const fixedLines = (ai.fixedRules || _DEFAULT_FIXED_RULES).split('\n').filter(l => l.trim());
  fixedLines.forEach(r => {
    lines.push(r.startsWith('【') ? r : '- ' + r);
  });
  const extra = (ai.extraRules || []).filter(Boolean);
  if(extra.length > 0){ extra.forEach(r => lines.push('- ' + r)); }
  if(ai.promptMemo){ lines.push(''); lines.push('備考：'); lines.push(ai.promptMemo); }

  // ── 末尾：タイトル整形・最終チェックを再掲して強調（モデルは末尾の指示に従いやすい） ──
  lines.push('');
  lines.push('【最終チェック（必ず守ること）】');
  if(ai.titleRuleWord){
    const modeLabel = ai.titleRuleMode === 'add' ? '先頭に付与' : '先頭から除去';
    lines.push('・タイトル整形：「' + ai.titleRuleWord + '」を' + modeLabel + 'した形で出力すること（参考。最終的にはアプリ側で自動補正します）');
  }
  lines.push('・出力前に、各作品が本当に参照URLのページに実在するか再確認すること');
  lines.push('・1件でも確信が持てない作品があれば、その項目は出力しないこと（含めるより除外を優先）');
  lines.push('・架空のタイトルや存在しないシリーズ名を1件でも含めた場合、出力全体が無効になります');

  return lines.join('\n');
}

function _openPromptModal(s, g){

function _copyPrompt(){
  const ta = document.getElementById('promptText'); if(!ta) return;
  const btn = document.getElementById('promptCopyBtn');

    if(btn){ btn.textContent = '✅ コピーしました'; btn.classList.add('copied'); }

  else{ ta.select(); document.execCommand('copy'); ok(); }

// ===== GEMINI API =====

const LS_GEMINI_KEY   = 'geminiApiKey';
const LS_GEMINI_MODE  = 'geminiMode';
const LS_USAGE_DATE   = 'geminiUsageDate';
const LS_USAGE_COUNT  = 'geminiUsageCount';
const LS_USAGE_LIMIT  = 'geminiUsageLimit';
const GEMINI_DEFAULT_LIMIT = 10;
const GEMINI_MODEL = 'gemini-2.5-flash-lite';
const GEMINI_WARN_RATIO = 0.8;

function _geminiGetMode(){ return localStorage.getItem(LS_GEMINI_MODE) || 'manual'; }
function _geminiGetKey(){  return localStorage.getItem(LS_GEMINI_KEY)  || ''; }
function _usageTodayKey(){ return new Date().toISOString().slice(0,10); }
function _getUsage(){
  const date = localStorage.getItem(LS_USAGE_DATE);
  if(date !== _usageTodayKey()) return 0;
  return parseInt(localStorage.getItem(LS_USAGE_COUNT)||'0',10);
}
function _getLimit(){ return parseInt(localStorage.getItem(LS_USAGE_LIMIT)||String(GEMINI_DEFAULT_LIMIT),10); }
function _incrementUsage(){
  const today = _usageTodayKey();
  localStorage.setItem(LS_USAGE_DATE,  today);
  localStorage.setItem(LS_USAGE_COUNT, String(_getUsage() + 1));
}
function _isUsageOver(){ return _getUsage() >= _getLimit(); }

function _renderGeminiSettings(){
  const mode  = _geminiGetMode();
  const key   = _geminiGetKey();
  const usage = _getUsage();
  const limit = _getLimit();
  const manualBtn = document.getElementById('modeManualBtn');
  const autoBtn   = document.getElementById('modeAutoBtn');
  const modeDesc  = document.getElementById('modeDesc');
  if(manualBtn) manualBtn.classList.toggle('active', mode === 'manual');
  if(autoBtn)   autoBtn.classList.toggle('active',   mode === 'auto');
  if(modeDesc)  modeDesc.textContent = mode === 'auto'
    ? '⚡ 自動モード：🤖ボタンでGemini APIを自動呼び出し'
    : '✍️ 手動モード：プロンプト生成 → AIへ貼り付け → JSON投入';
  const keyInput  = document.getElementById('geminiApiKeyInput');
  const keyStatus = document.getElementById('geminiApiKeyStatus');
  if(keyInput){ keyInput.value = key ? '●'.repeat(20) : ''; keyInput.dataset.saved = key ? '1' : ''; }
  if(keyStatus) keyStatus.textContent = key ? '✅ APIキーが保存されています' : '未設定';
  const fill     = document.getElementById('usageBarFill');
  const label    = document.getElementById('usageCountLabel');
  const limitInp = document.getElementById('usageLimitInput');
  const statusEl = document.getElementById('geminiUsageStatus');
  const resetLbl = document.getElementById('usageResetTimeLabel');
  const ratio    = limit > 0 ? usage / limit : 0;
  if(fill){
    fill.style.width = Math.min(ratio*100,100) + '%';
    fill.className = 'usage-bar-fill' + (ratio>=1?' over':ratio>=GEMINI_WARN_RATIO?' warn':'');
  }
  if(label)    label.textContent = usage + ' 回';
  if(limitInp) limitInp.value   = limit;
  if(statusEl){
    if(ratio >= 1){
      statusEl.style.display='block'; statusEl.className='gemini-status err';
      statusEl.textContent='⛔ 本日の上限に達しました。自動モードは停止中です。';
    } else if(ratio >= GEMINI_WARN_RATIO){
      statusEl.style.display='block'; statusEl.className='gemini-status warn';
      statusEl.textContent='⚠️ 残り ' + (limit - usage) + ' 回です。';
    } else { statusEl.style.display='none'; }
  }
  if(resetLbl) resetLbl.textContent = usage > 0 ? '翌0:00にリセットされます' : '';
}

function setGeminiMode(mode){
  if(mode === 'auto' && !_geminiGetKey()){ showToast('APIキーを先に設定してください'); return; }
  if(mode === 'auto' && _isUsageOver()){ showToast('本日の使用上限に達しています'); return; }
  localStorage.setItem(LS_GEMINI_MODE, mode);
  _renderGeminiSettings();
  showToast(mode === 'auto' ? '⚡ 自動モードに切り替えました' : '✍️ 手動モードに切り替えました');
}

function toggleApiKeyVisibility(){
  const inp = document.getElementById('geminiApiKeyInput');
  if(!inp) return;
  if(inp.type === 'password'){ inp.type='text'; const k=_geminiGetKey(); if(k) inp.value=k; }
  else{ inp.type='password'; const k=_geminiGetKey(); if(k) inp.value='●'.repeat(20); }
}

  const inp = document.getElementById('geminiApiKeyInput');

  localStorage.setItem(LS_GEMINI_KEY, val);

  _renderGeminiSettings();

}

  const inp = document.getElementById('usageLimitInput');

  _renderGeminiSettings();
}

  confirm2('使用回数をリセット','本日の使用回数を0に戻しますか？',()=>{
    localStorage.setItem(LS_USAGE_DATE,  _usageTodayKey());

async function _geminiAutoGenerate(sid, gid){
  const key = _geminiGetKey();
  if(!key){ showToast('⚠ APIキーが設定されていません'); setGeminiMode('manual'); return; }
  if(_isUsageOver()){ showToast('⛔ 本日の使用上限に達しています'); _renderGeminiSettings(); return; }
  const s = db.series.find(x=>x.id===sid);
  const g = s?.groups.find(x=>x.id===gid);
  if(!s || !g) return;
  const promptText = _buildPromptText(s, g);
  const panelEl = document.getElementById('aiPanel_' + gid);
  let loadingEl = null;
  if(panelEl){
    loadingEl = document.createElement('div');
    loadingEl.className = 'ai-generating';
    loadingEl.innerHTML = '<div class="ai-generating-dot"></div> Gemini APIで取得中...';
    panelEl.appendChild(loadingEl);
  }
  try{
    let res;
    try{
      res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`,
        { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            contents:[{parts:[{text:promptText}]}],
            tools:[{google_search:{}}],  // Web検索でURLの実内容を取得させる（ハルシネーション対策）
            generationConfig:{temperature:0,maxOutputTokens:8192}
          }) }
      );
    } catch(networkErr){
      // fetch自体が失敗（ネットワーク不通・CORS・DNS失敗など）
      throw new Error('通信エラー：' + (networkErr.message || 'Load failed') + '（APIキーの形式・ネットワーク接続を確認してください）');
    }
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      const msg = err?.error?.message || '';
      if(res.status === 400) throw new Error('リクエスト不正（400）：' + (msg || 'APIキーまたはリクエスト形式を確認してください'));
      if(res.status === 403) throw new Error('APIキーが無効または権限なし（403）：' + msg);
      if(res.status === 429) throw new Error('レート制限に達しました（429）。しばらく待ってから再試行してください');
      if(res.status === 404) throw new Error('モデルが見つかりません（404）：' + GEMINI_MODEL);
      throw new Error(`APIエラー ${res.status}：` + (msg || '不明なエラー'));
    }
    const data = await res.json();
    const raw  = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const finishReason = data?.candidates?.[0]?.finishReason || '';
    if(!raw){
      const blockReason = data?.promptFeedback?.blockReason || '';
      throw new Error('レスポンスが空でした' + (blockReason ? '（ブロック理由：' + blockReason + '）' : finishReason ? '（終了理由：' + finishReason + '）' : ''));
    }
    if(finishReason === 'MAX_TOKENS'){
      console.log('[Gemini raw response - truncated]', raw);
      throw new Error('出力が長すぎて途中で切れました（MAX_TOKENS）。グループを分割するか参照URLを減らしてください');
    }
    const json = _extractJSON(raw);
    if(!json){
      console.log('[Gemini raw response]', raw);
      throw new Error('JSONの抽出に失敗しました。詳細はコンソール（console.log）を確認してください');
    }
    // タイトル整形をコード側で確実に適用（AIの遵守に依存しない）
    const g2 = db.series.find(x=>x.id===sid)?.groups.find(x=>x.id===gid);
    const fixedJson = json.map(c => ({...c, title: _applyTitleRule(c.title, g2?.ai)}));
    _incrementUsage();
    _renderGeminiSettings();
    openBulkCandidateModal(sid, null, gid);
    setTimeout(()=>{
      const ta = document.getElementById('bulkJsonInput');
      if(ta){ ta.value = JSON.stringify(fixedJson, null, 2); ta.classList.remove('error'); _onBulkJsonInput(ta); }
    }, 80);
    showToast('✅ Geminiから ' + fixedJson.length + '件 取得しました');
  } catch(e){
    _showGeminiError(gid, e.message);
  } finally{
    if(loadingEl) loadingEl.remove();
  }
}

function _extractJSON(raw){
  let text = raw.trim();
  const block = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(block) text = block[1].trim();
  const start = text.indexOf('[');
  const end   = text.lastIndexOf(']');
  if(start === -1 || end === -1 || end <= start) return null;
  try{ return JSON.parse(text.slice(start, end+1)); } catch(e){ return null; }
}

function _showGeminiError(gid, msg){
  showToast('❌ ' + (msg||'エラーが発生しました'));
  const okEl = document.getElementById('aiSaveOk_' + gid);
  if(okEl){
    const orig = okEl.textContent;
    okEl.textContent='❌ '+(msg||'エラー'); okEl.style.color='var(--red)'; okEl.classList.add('show');
    setTimeout(()=>{ okEl.textContent=orig; okEl.style.color=''; okEl.classList.remove('show'); }, 3000);
  }
}

function saveNewBook(sid){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  const gid = document.getElementById('ab_group').value;
  const title = document.getElementById('ab_title').value.trim();
  const displayNum = document.getElementById('ab_num').value.trim();
  const orderInput = document.getElementById('ab_order').value.trim();
  const owned = document.getElementById('ab_owned').value === '1';
  const memo = document.getElementById('ab_memo').value;

  if(!title){
    alert('タイトルを入力してください');
    return;
  }

  let books;

  if(gid === '__default'){
    s.books = s.books || [];
    books = s.books;
  }else{
    const g = s.groups.find(x => x.id === gid);
    if(!g) return;
    g.books = g.books || [];
    books = g.books;
  }

  const maxOrder = books.length
    ? Math.max(...books.map(b => b.order || 0))
    : 0;

  books.push({
    id: genId(),
    title,
    displayNum,
    owned,
    memo,
    order: orderInput ? parseFloat(orderInput) || maxOrder + 1 : maxOrder + 1
  });

  saveDB();
  closeModal();
  renderDetail();
  showToast('本を追加しました');
}

    </div>

function updateBook(sid,gid,bid){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  const oldBooks =
    gid === '__default'
      ? s.books
      : s.groups.find(g => g.id === gid)?.books;

  const b = oldBooks?.find(x => x.id === bid);
  if(!b) return;

  const newGid = document.getElementById('eb_group').value;
  const title = document.getElementById('eb_title').value.trim();

  if(!title){
    alert('タイトルは必須です');
    return;
  }

  b.title = title;
  b.displayNum = document.getElementById('eb_num').value.trim();
  b.order = parseFloat(document.getElementById('eb_order').value) || 0;
  b.owned = document.getElementById('eb_owned').value === '1';
  b.memo = document.getElementById('eb_memo').value;

  if(newGid !== gid){
    let newBooks;

    if(newGid === '__default'){
      s.books = s.books || [];
      newBooks = s.books;
    }else{
      const newGroup = s.groups.find(g => g.id === newGid);
      if(!newGroup) return;
      newGroup.books = newGroup.books || [];
      newBooks = newGroup.books;
    }

    const oldIndex = oldBooks.findIndex(x => x.id === bid);
    if(oldIndex >= 0){
      oldBooks.splice(oldIndex, 1);
    }

    newBooks.push(b);
  }

  saveDB();
  closeModal();
  renderDetail();
  showToast('保存しました');
}
function deleteBook(sid,gid,bid){
  const s=db.series.find(x=>x.id===sid);
  const isDefault=gid==='__default';
  const books=isDefault?s?.books:s?.groups.find(g=>g.id===gid)?.books;
  const b=books?.find(x=>x.id===bid);if(!b)return;
  confirm2('本を削除',`「${b.title}」を削除しますか？`,()=>{
    if(isDefault)s.books=s.books.filter(x=>x.id!==bid);
    else{const g=s.groups.find(x=>x.id===gid);if(g)g.books=g.books.filter(x=>x.id!==bid);}
    saveDB();closeModal();renderDetail();showToast('削除しました');
  });
}


// order -> 表示番号 -> タイトルでソート
function getSortText(b){
  return String(b.displayNum || b.title || '');
}

function sortBooks(a,b){
  const ao = Number(a.order || 0);
  const bo = Number(b.order || 0);

  if(ao || bo){
    return ao - bo;
  }

  return getSortText(a).localeCompare(
    getSortText(b),
    'ja',
    {numeric:true, sensitivity:'base'}
  );
}

//抜け巻表示用
function showMissingList(e, sid){
  if(e) e.stopPropagation();

  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  const miss = missingBooks(s);

  if(miss.length === 0){
    showSheet('📋 抜け巻一覧', '抜けている巻はありません');
    return;
  }

  const grouped = {};

miss.forEach(m => {
  const groupName = m.groupName || 'グループなし';

  if(!grouped[groupName]){
    grouped[groupName] = [];
  }

  const num = m.book.displayNum ? m.book.displayNum + ' ' : '';
  grouped[groupName].push(num + m.book.title);
});

const text = Object.keys(grouped).map(groupName => {
  return `【${groupName}】\n` + grouped[groupName].join('\n');
}).join('\n\n');

  showSheet('📋 抜け巻一覧', text);
}

function _getSampleCandidates(seriesName){
  // 完全一致
  if(SAMPLE_CANDIDATES_BY_SERIES[seriesName]) return SAMPLE_CANDIDATES_BY_SERIES[seriesName];
  // 部分一致（シリーズ名にキーワードが含まれる）
  for(const key of Object.keys(SAMPLE_CANDIDATES_BY_SERIES)){
    if(seriesName.includes(key) || key.includes(seriesName)){
      return SAMPLE_CANDIDATES_BY_SERIES[key];
    }
  }
  // 一致なし → 汎用サンプル（シリーズ名を埋め込み、3パターンを明示）
  return [
    {title:seriesName + ' 第1巻（サンプル）', displayNum:'1巻', publisher:'（サンプル出版社）', label:'（サンプルレーベル）', publishedDate:'2020-01-01', confidence:'high',   reason:'シリーズ名・出版社・レーベルが一致'},
    {title:seriesName + ' 第2巻（サンプル）', displayNum:'2巻', publisher:'（サンプル出版社）', label:'',                    publishedDate:'2020-06-01', confidence:'medium', reason:'出版社は一致、レーベル未取得'},
    {title:seriesName + ' 第3巻（サンプル）', displayNum:'3巻', publisher:'',                   label:'',                    publishedDate:'2021-01-01', confidence:'low',    reason:'タイトルはヒットしたが、出版社またはレーベルが検索条件と不一致'},
  ];
}

let bulkCandidates = [];
let bulkChecked = new Set();

function openBulkCandidateModal(sid, candidates, defaultGid){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  const defaultGroup = defaultGid && defaultGid !== '__default'
    ? s.groups.find(g => g.id === defaultGid) : null;
  const groupNameForSearch = defaultGroup ? defaultGroup.name : null;

  const isSample = !candidates;
  bulkCandidates = (candidates || _getSampleCandidates(s.name, groupNameForSearch)).slice().sort((a,b)=>{
    return (a.publishedDate||'').localeCompare(b.publishedDate||'');
  });

  const existingTitles = new Set();
  (s.books || []).forEach(b => existingTitles.add(b.title.trim()));
  s.groups.forEach(g => (g.books || []).forEach(b => existingTitles.add(b.title.trim())));

  bulkChecked = new Set();
  bulkCandidates.forEach((c, i) => {
    const dup = existingTitles.has(c.title.trim());
    if(!dup && (c.confidence === 'high' || c.confidence === 'medium')){
      bulkChecked.add(i);
    }
  });

  const groupOptions = [
    '<option value="__default"' + (!defaultGid || defaultGid === '__default' ? ' selected' : '') + '>グループなし</option>',
    ...s.groups.map(g =>
      '<option value="' + g.id + '"' + (g.id === defaultGid ? ' selected' : '') + '>' + esc(g.name) + '</option>'
    )
  ].join('');

  const searchLabel = groupNameForSearch
    ? esc(s.name) + '　›　' + esc(groupNameForSearch)
    : esc(s.name);

  const bulkDOM = _buildBulkModalHTML(sid, groupOptions, isSample, searchLabel);
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.onclick = () => closeModal(ov);
  const modalEl = document.createElement('div');
  modalEl.className = 'modal bulk-modal';
  modalEl.appendChild(bulkDOM);
  ov.appendChild(backdrop);
  ov.appendChild(modalEl);
  document.body.appendChild(ov);
  modalStack.push(ov);
  setTimeout(() => {
    const ta = document.getElementById('bulkJsonInput');
    if(ta) ta.value = JSON.stringify(bulkCandidates, null, 2);
  }, 0);
  _renderBulkList(existingTitles);
}

function _buildBulkModalHTML(sid, groupOptions, isSample, searchLabel){
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="modal-head">
      <div style="flex:1;min-width:0;">
        <div class="modal-title">📋 候補から一括追加</div>
        <div style="font-size:12px;color:var(--br3);margin-top:1px;">${searchLabel || ''}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="bulk-json-panel">
        <div class="bulk-json-label">
          📄 候補JSON
          ${isSample ? '<span style="background:#fff3cd;color:#7a5800;padding:1px 8px;border-radius:10px;font-weight:400;">サンプル表示中</span>' : ''}
        </div>
        <textarea class="bulk-json-textarea" id="bulkJsonInput"
          placeholder='[{"title":"書名","displayNum":"1","confidence":"high"}]'
          oninput="_onBulkJsonInput(this)"></textarea>
        <div class="bulk-json-err" id="bulkJsonErr"></div>
        <div class="bulk-json-actions">
          <span class="bulk-json-hint">JSONを貼り付けると候補一覧が更新されます</span>
          <button class="btn btn-ghost btn-sm" onclick="_loadSampleCandidates()">サンプルを読む</button>
          <button class="btn btn-ghost btn-sm" onclick="_clearBulkJson()">クリア</button>
        </div>
      </div>
      <div class="bulk-target-bar">
        <span class="bulk-target-label">追加先：</span>
        <select id="bulk_group" onchange="_refreshBulkSelCount()">${groupOptions}</select>
      </div>
      <div class="bulk-sel-bar">
        <span class="bulk-sel-count" id="bulkSelCount"></span>
        <button class="btn btn-ghost btn-sm" onclick="_bulkSelectAll()">全選択</button>
        <button class="btn btn-ghost btn-sm" onclick="_bulkSelectNone()">全解除</button>
      </div>
      <div class="bulk-cand-list" id="bulkCandList"></div>
    </div>
    <div class="bulk-foot">
      <span class="bulk-added-count" id="bulkAddedMsg"></span>
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" id="bulkAddBtn">まとめて追加</button>
    </div>
  `;
  el.querySelector('#bulkAddBtn').addEventListener('click', function(){ _executeBulkAdd(sid); });
  return el;
}

function _onBulkJsonInput(ta){
  const raw = ta.value.trim();
  const errEl = document.getElementById('bulkJsonErr');
  const addedMsg = document.getElementById('bulkAddedMsg');
  if(addedMsg) addedMsg.textContent = '';
  if(!raw){
    ta.classList.remove('error');
    if(errEl) errEl.textContent = '';
    bulkCandidates = []; bulkChecked = new Set();
    _renderBulkList(); return;
  }
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    ta.classList.add('error');
    if(errEl) errEl.textContent = '⚠ JSONの形式が正しくありません：' + e.message;
    return;
  }
  if(!Array.isArray(parsed)) parsed = [parsed];
  const invalid = parsed.filter(c => !c.title);
  if(invalid.length > 0){
    ta.classList.add('error');
    if(errEl) errEl.textContent = '⚠ title フィールドのないデータが ' + invalid.length + ' 件あります';
    return;
  }
  ta.classList.remove('error');
  if(errEl) errEl.textContent = '';

  const s = db.series.find(x => x.id === currentSeriesId);

  // 選択中グループの ai 設定を取得し、タイトル整形をコード側で確実に適用
  const gsel = document.getElementById('bulk_group');
  const gidForRule = gsel ? gsel.value : null;
  const groupForRule = (s && gidForRule && gidForRule !== '__default')
    ? s.groups.find(g => g.id === gidForRule) : null;
  if(groupForRule && groupForRule.ai && groupForRule.ai.titleRuleWord){
    parsed = parsed.map(c => ({...c, title: _applyTitleRule(c.title, groupForRule.ai)}));
  }

  bulkCandidates = parsed.slice().sort((a,b) =>
    (a.publishedDate||'').localeCompare(b.publishedDate||'')
  );
  const existingTitles = new Set();
  if(s){
    (s.books||[]).forEach(b => existingTitles.add(b.title.trim()));
    s.groups.forEach(g => (g.books||[]).forEach(b => existingTitles.add(b.title.trim())));
  }
  bulkChecked = new Set();
  bulkCandidates.forEach((c,i) => {
    if(!existingTitles.has(c.title.trim()) && (c.confidence==='high'||c.confidence==='medium'))
      bulkChecked.add(i);
  });
  _renderBulkList(existingTitles);
}

function _loadSampleCandidates(){
  const s = db.series.find(x => x.id === currentSeriesId);
  if(!s) return;
  const gsel = document.getElementById('bulk_group');
  const gid  = gsel ? gsel.value : null;
  const grp  = gid && gid !== '__default' ? s.groups.find(g => g.id === gid) : null;
  const sample = _getSampleCandidates(s.name, grp ? grp.name : null);
  const ta = document.getElementById('bulkJsonInput');
  if(ta){ ta.value = JSON.stringify(sample, null, 2); ta.classList.remove('error'); }
  const errEl = document.getElementById('bulkJsonErr');
  if(errEl) errEl.textContent = '';
  bulkCandidates = sample.slice().sort((a,b) => (a.publishedDate||'').localeCompare(b.publishedDate||''));
  const existingTitles = new Set();
  (s.books||[]).forEach(b => existingTitles.add(b.title.trim()));
  s.groups.forEach(g => (g.books||[]).forEach(b => existingTitles.add(b.title.trim())));
  bulkChecked = new Set();
  bulkCandidates.forEach((c,i) => {
    if(!existingTitles.has(c.title.trim()) && (c.confidence==='high'||c.confidence==='medium'))
      bulkChecked.add(i);
  });
  _renderBulkList(existingTitles);
}

function _clearBulkJson(){
  const ta = document.getElementById('bulkJsonInput');
  if(ta){ ta.value = ''; ta.classList.remove('error'); }
  const errEl = document.getElementById('bulkJsonErr');
  if(errEl) errEl.textContent = '';
  const addedMsg = document.getElementById('bulkAddedMsg');
  if(addedMsg) addedMsg.textContent = '';
  bulkCandidates = []; bulkChecked = new Set();
  _renderBulkList();
}

function _renderBulkList(existingTitles){
  if(!existingTitles){
    const s = db.series.find(x => x.id === currentSeriesId);
    existingTitles = new Set();
    if(s){
      (s.books || []).forEach(b => existingTitles.add(b.title.trim()));
      s.groups.forEach(g => (g.books || []).forEach(b => existingTitles.add(b.title.trim())));
    }
  }
  const el = document.getElementById('bulkCandList');
  if(!el) return;

  if(bulkCandidates.length === 0){
    el.innerHTML = '<div class="bulk-empty">候補データがありません</div>';
    _refreshBulkSelCount();
    return;
  }

  const confLabel = {high:'精度：高', medium:'精度：中', low:'精度：低'};
  el.innerHTML = bulkCandidates.map((c, i) => {
    const dup = existingTitles.has(c.title.trim());
    const checked = bulkChecked.has(i);
    const conf = c.confidence || 'medium';
    const needsCheck = conf === 'low' || !c.sourceUrl;
    const metaParts = [
      c.publisher ? esc(c.publisher) : '',
      c.label ? esc(c.label) : '',
      c.publishedDate ? esc(c.publishedDate) : '',
    ].filter(Boolean);
    const meta = metaParts.join(' ／ ');
    return '<div class="cand-item conf-' + esc(conf) + (dup ? ' is-dup' : '') + '" onclick="_toggleBulkCheck(' + i + ')" id="cand_' + i + '">'
      + '<div class="cand-cb' + (checked ? ' checked' : '') + '" id="candCb_' + i + '">' + (checked ? '✓' : '') + '</div>'
      + '<div class="cand-body">'
      + (c.displayNum ? '<div class="cand-num">' + esc(c.displayNum) + '</div>' : '')
      + '<div class="cand-title">' + esc(c.title) + (dup ? '<span class="cand-dup-badge">登録済み</span>' : '') + (needsCheck ? '<span class="cand-check-badge">⚠️要確認</span>' : '') + '</div>'
      + (meta ? '<div class="cand-meta">' + meta + '</div>' : '')
      + (c.reason ? '<div class="cand-reason">🔍 ' + esc(c.reason) + '</div>' : '')
      + (c.sourceUrl ? '<div class="cand-source">🔗 ' + esc(c.sourceUrl) + '</div>' : '')
      + '</div>'
      + '<span class="cand-conf">' + esc(confLabel[conf] || conf) + '</span>'
      + '</div>';
  }).join('');
  _refreshBulkSelCount();
}

function _toggleBulkCheck(i){
  if(bulkChecked.has(i)) bulkChecked.delete(i);
  else bulkChecked.add(i);
  const cb = document.getElementById('candCb_' + i);
  if(cb){
    const checked = bulkChecked.has(i);
    cb.className = 'cand-cb' + (checked ? ' checked' : '');
    cb.textContent = checked ? '✓' : '';
  }
  _refreshBulkSelCount();
}

function _bulkSelectAll(){
  bulkCandidates.forEach((_, i) => bulkChecked.add(i));
  _renderBulkList();
}
function _bulkSelectNone(){
  bulkChecked.clear();
  _renderBulkList();
}

function _refreshBulkSelCount(){
  const el = document.getElementById('bulkSelCount');
  if(el) el.textContent = bulkChecked.size + ' 件を選択中';
  const btn = document.getElementById('bulkAddBtn');
  if(btn) btn.disabled = bulkChecked.size === 0;
}

function _executeBulkAdd(sid){
  const s = db.series.find(x => x.id === sid);
  if(!s) return;

  // 追加先グループのbooksリスト
  const gid = document.getElementById('bulk_group')?.value || '__default';
  let targetBooks;
  if(gid === '__default'){
    s.books = s.books || [];
    targetBooks = s.books;
  } else {
    const g = s.groups.find(x => x.id === gid);
    if(!g) return;
    g.books = g.books || [];
    targetBooks = g.books;
  }

  // シリーズ全体の全本をタイトル→bookオブジェクトのMapで引けるようにする
  const allBooksMap = new Map();
  (s.books || []).forEach(b => allBooksMap.set(b.title.trim(), b));
  s.groups.forEach(g => (g.books || []).forEach(b => allBooksMap.set(b.title.trim(), b)));

  const toProcess = [...bulkChecked].sort((a,b) => a - b).map(i => bulkCandidates[i]);
  let addedCount = 0, patchedCount = 0;

  toProcess.forEach(c => {
    const existing = allBooksMap.get(c.title.trim());
    if(existing){
      // タイトル一致 → 空欄のみ補完（上書きしない）
      let patched = false;
      if(!existing.publisher    && c.publisher)    { existing.publisher    = c.publisher;    patched = true; }
      if(!existing.label        && c.label)        { existing.label        = c.label;        patched = true; }
      if(!existing.publishedDate && c.publishedDate){ existing.publishedDate = c.publishedDate; patched = true; }
      if(patched) patchedCount++;
    } else {
      // タイトル不一致 → 新規追加
      targetBooks.push({
        id: genId(), title: c.title, displayNum: c.displayNum || '',
        publisher: c.publisher || '', label: c.label || '',
        publishedDate: c.publishedDate || '',
        owned: false, memo: '', order: 0,
      });
      addedCount++;
    }
  });

  saveDB();
  const parts = [];
  if(addedCount   > 0) parts.push('新規追加 ' + addedCount + '冊');
  if(patchedCount > 0) parts.push('情報補完 ' + patchedCount + '冊');
  const resultText = parts.length > 0 ? parts.join('・') : '変更なし';

  const msg = document.getElementById('bulkAddedMsg');
  if(msg){ msg.textContent = '✅ ' + resultText; msg.style.color = 'var(--owned)'; }
  bulkChecked.clear();
  _renderBulkList();
  setTimeout(()=>{ closeModal(); renderDetail(); showToast(resultText); }, 800);
}

// ===== UTIL =====
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ===== INIT =====
loadDB();
renderHome();
</script>
